imagery:
  photography:
    style: "Minimal, clean, authentic — not stock-y"
    subjects: "Real developers, workspaces, screens showing code/data"
    treatment: "Natural lighting, muted tones, no heavy filters"
    avoid:
      - "Corporate handshakes"
      - "Staged meetings"
      - "Generic 'AI' imagery (robots, blue circuits)"

  illustrations:
    style: "Clean line art or simple flat illustrations"
    use: "Explain concepts, empty states, onboarding"
    palette: "Use brand colors only"

  icons:
    style: "Outlined (not filled), 1.5-2px stroke weight"
    sources:
      - name: "Heroicons"
        url: "https://heroicons.com"
      - name: "Lucide"
        url: "https://lucide.dev"
    consistency: "Use one icon set throughout"

  data_visualization:
    - "Use brand colors for charts and graphs"
    - "Savings shown in green, overspend in amber/red"
    - "Clear labels, no chartjunk"

voice:
  characteristics:
    we_are:
      - "Direct — Get to the point"
      - "Honest — Tell it like it is"
      - "Helpful — Genuinely useful"
      - "Confident — Know our stuff"
      - "Clear — Easy to understand"
      - "Human — Real people talking"
    we_are_not:
      - "Wordy or vague"
      - "Salesy or manipulative"
      - "Condescending or preachy"
      - "Arrogant or dismissive"
      - "Jargon-heavy or academic"
      - "Corporate or robotic"

  tone_variations:
    - context: "Marketing"
      tone: "Confident, direct, benefit-focused"
      example: "Stop overpaying for AI. See what you're missing in 2 minutes."
    - context: "Product UI"
      tone: "Clear, helpful, action-oriented"
      example: "We found 3 models that could save you money. Review recommendations."
    - context: "Support"
      tone: "Warm, patient, solution-focused"
      example: "Got it. Let me walk you through how to fix this."
    - context: "Error Messages"
      tone: "Calm, clear, helpful"
      example: "Something went wrong. Try refreshing, or contact us if it keeps happening."
    - context: "Social Media"
      tone: "Casual, engaging, real"
      example: "Just found a model that's 40% cheaper with better performance. Love when that happens."
    - context: "Documentation"
      tone: "Precise, thorough, scannable"
      example: "To add a new model to your stack, click Settings > Models > Add Model."

  writing_guidelines:
    do:
      - "Lead with the benefit, then explain"
      - "Use 'you' and 'your' — talk TO the user"
      - "Use specific numbers when possible ('Save 23%', not 'Save money')"
      - "Show your reasoning — transparency builds trust"
      - "Admit when you don't know something"
      - "Use contractions (we're, you'll, it's) — sounds more human"
    dont:
      - "Use jargon without explanation"
      - "Oversell or hype"
      - "Make promises you can't keep"
      - "Use passive voice when active is clearer"
      - "Be condescending ('Simply click...' implies it should be obvious)"
      - "Use filler words (very, really, actually, just)"

  vocabulary:
    preferred:
      - word: "Recommend"
        why: "We advise, we don't demand"
      - word: "Insight"
        why: "We provide understanding, not just data"
      - word: "Independent"
        why: "Our core differentiator"
      - word: "Your use case"
        why: "Personalized, not generic"
      - word: "Save / Savings"
        why: "Concrete benefit"
      - word: "Optimize"
        why: "Active improvement"
      - word: "Transparent"
        why: "Our methodology is open"
    avoid:
      - word: "Cheap"
        why: "Sounds low-quality"
        use_instead: "Cost-effective or saves money"
      - word: "Best"
        why: "Subjective and generic"
        use_instead: "Best for your use case"
      - word: "Revolutionary"
        why: "Overused tech hype"
        use_instead: "Different or specific benefit"
      - word: "Synergy"
        why: "Corporate jargon"
        use_instead: "Just say what you mean"
      - word: "Leverage"
        why: "Jargon"
        use_instead: "Use"
      - word: "AI-powered"
        why: "Meaningless in 2026"
        use_instead: "Describe what it does"

