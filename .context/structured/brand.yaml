    concept: "Clean, modern wordmark with a subtle visual element suggesting clarity, optimization, or insight."
    specifications:
      primary: "ModelOptix wordmark"
      mark: "Standalone icon for app icons, favicons"
      clear_space: "Minimum padding equal to the height of the 'O' in ModelOptix"
      minimum_size_digital: "80px width"
      minimum_size_print: "20mm"
    usage:
      - "Use primary logo on light backgrounds"
      - "Use reversed (white) logo on dark backgrounds"
      - "Never stretch, rotate, or alter proportions"
      - "Never add effects (shadows, gradients, outlines)"

