metadata:
  version: "1.0"
  date: "January 2026"

brand_overview:
  essence: "Independent truth in AI."
  promise: "We work for you. We find the savings, you decide what to do with them. We promise to always give you unbiased, transparent guidance on your AI stack — with nothing to sell but the truth."

  values:
    - name: "Independence Above All"
      manifestation: "We stay structurally free from conflicts. No investors, no partners, no hidden agendas. Our structure IS our promise."
    - name: "Radical Transparency"
      manifestation: "We show our work. Every recommendation includes data sources, reasoning, and confidence levels. If we don't know, we say so."
    - name: "Truth Is Our Product"
      manifestation: "We don't sell software — we sell truth. In a world of AI with hidden agendas, truth is king."
    - name: "Solopreneur Spirit"
      manifestation: "Lean, fast, user-obsessed. No bureaucracy, no bloat, no forgetting who we serve."
    - name: "Skin in the Game"
      manifestation: "We use what we build. We recommend what we'd use ourselves. Our success is tied to yours."

brand_personality:
  traits:
    - trait: "Straight-talking"
      description: "Direct, no BS, says what others won't"
      example: "You're overpaying. Here's proof."
    - trait: "Trustworthy"
      description: "Reliable, consistent, keeps promises"
      example: "Every recommendation shows its reasoning."
    - trait: "Clever"
      description: "Smart but not arrogant, insightful without being condescending"
      example: "We monitor 400+ models so you don't have to."
    - trait: "Independent"
      description: "Uncompromised, stands apart, answers to no one but users"
      example: "No investors. No partners. No agenda."
    - trait: "Helpful"
      description: "Genuinely wants users to succeed, not just to sell"
      example: "Here's exactly how to switch — and how to roll back if needed."

  archetypes:
    primary:
      name: "The Sage"
      description: "The wise advisor who seeks truth and shares knowledge. ModelOptix is the trusted guide helping developers navigate complexity with clarity and insight."
    secondary:
      name: "The Outlaw/Rebel"
      description: "Challenges the status quo and refuses to play by rigged rules. ModelOptix stands against vendor bias and hidden agendas in the AI industry."

  if_brand_were_person:
    age: "Mid-30s — experienced enough to know things, young enough to move fast"
    speaks_like: "A senior developer friend who's done the research and is sharing what they found — direct, knowledgeable, zero fluff"
    dresses_like: "Clean and functional — quality hoodie or simple tee, not a suit, not sloppy"
    values: "Honesty over diplomacy, results over appearances, independence over popularity"
    would_say: "Look, I tested this myself. Here's what actually works."

visual_identity:
