metadata:
  version: "1.2"
  date: "January 2026"
  purpose: "Understanding who we serve and how to genuinely help them succeed"

core_philosophy: "I work for you. I find the savings, you decide what to do with them."

personas:
  primary:
    name: "The Solopreneur Builder"
    priority: 1
    role: "beachhead"
    demographics:
      description: "Solo founders or very small teams (1-3 people) building AI-powered products"
      funding: "Bootstrapped or self-funded"
      products: "SaaS tools, automation services, or AI-enhanced apps"
    motivations:
      primary: "Save money - they're watching every expense"
      secondary: "Save time - they're doing everything themselves"
      fear: "Getting left behind as AI evolves, or quietly overpaying without realizing it"
    behavior:
      decision_speed: "Decide fast - if it doesn't prove value in 10 minutes, they're out"
      trust_source: "Trust social proof from peers over marketing claims"
      preference: "Value 'set and forget' solutions that work without constant attention"
      skepticism: "Skeptical of anything with hidden agendas"
    channels:
      - "X/Twitter (build in public community)"
      - "Indie Hackers forum"
      - "WIP.co"
      - "Product Hunt"
    frustrations:
      - "Did research once, picked a model, shipped it... now 6 months later they suspect they're overpaying but can't justify stopping to re-evaluate"
      - "400+ models changing constantly - impossible to keep up"
      - "Leaderboards exist but give generic advice, not personalized recommendations"
      - "Enterprise tools are overkill and overpriced"
    trust_sequence:
      - "Quick win"
      - "Social proof"
      - "Skin in the game"

  secondary:
    name: "The Indie Developer"
    priority: 2
    role: "beachhead"
    demographics:
      description: "Technical builders with open-source mindset"
      work_context: "May work at companies but build side projects"
      mindset: "Curious about methodology and 'how things work'"
      skepticism_level: "Often more skeptical and research-oriented than solopreneurs"
    motivations:
      primary: "Best tool for the job + efficiency"
      secondary: "Intellectual curiosity about the methodology"
      validation: "Community validation matters to them"
    behavior:
      decision_style: "Methodology first - show your work or they won't trust it"
      curiosity: "Want to understand the 'why' behind recommendations"
      values: "Value transparency and open approaches"
      patience: "More patient in evaluation but harder to convince"
    channels:
      - "Hacker News"
      - "Reddit (r/LocalLLaMA, r/MachineLearning)"
      - "GitHub communities"
      - "Technical Discord servers"
    frustrations:
      - "Leaderboards don't explain their methodology"
      - "Benchmarks are often gamed or vendor-influenced"
      - "Tools treat them like enterprise customers, not individuals"
      - "No way to validate claims before committing"
    trust_sequence:
      - "No BS"
      - "Open methodology"
      - "Community validation"

  tertiary:
    name: "The Startup CTO"
    priority: 3
    role: "expansion via bottom-up adoption"
    demographics:
      stage: "Early-stage startups (Seed through Series B)"
      responsibility: "Technical leaders managing small dev teams using LLMs in production"
      accountability: "Both tech decisions and cost efficiency"
    motivations:
      primary: "Team efficiency"
      secondary: "Risk reduction - can't afford a bad decision"
      tertiary: "Speed to implementation"
      quaternary: "Cost optimization (but not at expense of reliability)"
    behavior:
      adoption_path: "Bottom-up adoption - if their devs love it, they'll standardize"
      justification: "Need ROI story to justify budget"
      trust_source: "Trust peer recommendations from other CTOs"
    channels:
      - "Private CTO communities and Slack groups"
      - "Hacker News"
      - "LinkedIn"
      - "Conference networks"
    frustrations:
      - "Each dev picking different models with no consistency"
      - "No aggregate view of AI spend across team"
      - "Can't prove optimization ROI to leadership"

anti_personas:
  - type: "Enterprise procurement"
    reason: "Need vendor relationships, RFPs, SOC2 - we're not that"
  - type: "Non-technical decision makers"
    reason: "They need consultants, not self-serve tools"
  - type: "Hobbyists/researchers"
    reason: "Not spending enough to care about optimization"
  - type: "People wanting us to choose for them"
    reason: "We guide and recommend - they decide"

problems:
  solopreneur_builder:
    surface:
      - "I don't know if I'm using the right model"
      - "I think I'm overpaying but I don't have time to research"
      - "The AI landscape changes too fast to keep up"
      - "I picked GPT-4 months ago and haven't looked back"
    root_cause:
      - name: "Portfolio Drift"
        description: "They did research once, shipped it, and now they're months behind the curve - overpaying and underperforming but can't justify stopping to re-evaluate"
      - name: "Information Overload"
        description: "400+ models, constant price changes, conflicting benchmarks - no single source of truth"
      - name: "No Unbiased Guidance"
        description: "Every tool has hidden incentives (volume-based routing, affiliate deals, vendor relationships)"
      - name: "Opportunity Cost of Research"
        description: "Time spent researching is time not shipping"
    unrecognized:
      - "They're likely overpaying by 20-40% on models that have cheaper equivalents"
      - "Better models for their specific use cases exist but aren't on their radar"
      - "They're making decisions based on stale information (3-6 months old)"
      - "Their competitors who optimize are gaining cost advantages"
    impact:
      financial: "Quietly bleeding money every month on suboptimal choices"
      competitive: "Falling behind competitors who optimize their AI stack"
      emotional: "Background anxiety about 'am I doing this right?' without time to check"
      opportunity: "Missing better tools that could improve their product"

  indie_developer:
    surface:
      - "Leaderboards don't explain their methodology"
      - "I don't trust benchmarks - they're often gamed"
      - "I want to understand WHY a model is better, not just that it is"
      - "Enterprise tools treat me like a Fortune 500 company"
    root_cause:
      - name: "Trust Deficit"
        description: "No transparent, independent source they can verify"
      - name: "Methodology Opacity"
        description: "Recommendations without reasoning feel like black boxes"
      - name: "Size Mismatch"
        description: "Tools built for enterprise don't fit solo/indie workflows"
      - name: "Validation Gap"
        description: "No way to test recommendations before committing"
    unrecognized:
      - "They spend hours on research that could be automated"
      - "Their skepticism causes analysis paralysis and delayed decisions"
      - "They dismiss good options because they can't verify claims"
      - "Community knowledge is scattered and hard to aggregate"
    impact:
      time: "Hours lost to manual research and validation"
      decision_quality: "Paralysis leads to sticking with 'safe' choices"
      competitive: "Moving slower than builders who trust and act faster"

  startup_cto:
    surface:
      - "Every dev on my team uses different models"
      - "I can't see aggregate AI spend across the team"
      - "I need to justify optimization ROI to leadership"
      - "We can't stop shipping to standardize"
    root_cause:
      - name: "Visibility Gap"
        description: "No centralized view of what models are used where"
      - name: "Standardization Friction"
        description: "No easy path from individual choices to team standards"
      - name: "ROI Uncertainty"
        description: "Can't quantify savings to justify the effort"
      - name: "Adoption Resistance"
        description: "Devs resist top-down mandates on tools"
    unrecognized:
      - "Inconsistent model choices create technical debt"
      - "Team is collectively overspending but no one owns the problem"
      - "Bottom-up tool adoption is happening without governance"
      - "Competitors with optimized AI stacks ship faster and cheaper"
    impact:
      financial: "Team-wide overspend with no accountability"
      operational: "Inconsistency creates maintenance burden"
      strategic: "Leadership asking 'why is our AI bill so high?'"

filtering_criteria:
  green_flags:
    - flag: "Spending $50+/month on LLM APIs"
      why: "Real problem, real urgency - could save $600-2400/year"
    - flag: "'I picked my model months ago'"
      why: "Portfolio drift - our core problem"
    - flag: "Bootstrapped / self-funded"
      why: "Every dollar matters - week 1 payback resonates"
    - flag: "Decides their own AI stack"
      why: "No procurement blockers"
  hard_requirement: "Only hard requirement is spending real money on LLMs (or about to). Without that, nothing to optimize."
  note: "First-time builders or SaaS builders adding LLM to existing apps are valid prospects - they're about to make the decision we can help with."

  red_flags:
    - flag: "'Can you just tell me what to use?'"
      why: "Wants answers, not guidance - will churn"
    - flag: "Needs procurement/enterprise process"
      why: "We're not built for that"
    - flag: "Experimenting with no intent to ship"
      why: "No urgency, no real problem"
    - flag: "Expects hands-on support"
      why: "We're self-serve"

  graceful_redirects:
    - not_fit: "Enterprise needs"
      redirect_to: "Portkey, Helicone"
    - not_fit: "Needs consulting"
      redirect_to: "AI consulting firms"
    - not_fit: "Just experimenting"
      redirect_to: "'Come back when you're ready to ship'"

success_definitions:
  by_persona:
    solopreneur: "I recovered my annual cost in week 1 and now it's pure profit - didn't waste hours figuring it out"
    indie_dev: "I can prove 1000x ROI with transparent methodology I can verify and trust"
    startup_cto: "My team is standardized and I can show quantified ROI to leadership"

  timeline:
    first_10_minutes: "'This showed me something I didn't know' (first insight)"
    first_week: "Recovered annual subscription cost through identified savings (week 1 payback)"
    first_month: "Trusts the tool, checks it regularly, acting on recommendations"
    three_plus_months: "Stopped worrying about model choices - it's handled"
    year_one: "1000x return achieved for many users through compounding savings"

value_alignment:
  problem_solution_mapping:
    - problem: "Portfolio drift"
      solution: "Proactive alerts when better/cheaper options exist"
    - problem: "Information overload"
      solution: "I monitor 400+ models so they don't have to"
    - problem: "No unbiased guidance"
      solution: "I work for my subscribers, not the model providers"
    - problem: "Can't validate before switching"
      solution: "Sanity check feature - test before you commit"

marketing_physics_by_tier:
  solo:
    price: "$9.95/mo"
    overt_benefit: "3 products monitored, 10 sanity checks/mo, 90-day history - Week 1 payback"
    dramatic_difference: "Recover $120 annual cost in first week, then pure profit"
    fomo_trigger: "'Your 4th project flies blind. No webhooks, no custom alerts.' → Upgrade to Growth"
  growth:
    price: "$19.95/mo"
    label: "Hero Tier"
    overt_benefit: "10 products, 30 checks/mo, webhooks, custom alerts, 1-year history"
    dramatic_difference: "Complete automation + scale for just $10 more than Solo"
    fomo_trigger: "'No API access, can't prove ROI to stakeholders.' → Upgrade to Pro"
  pro:
    price: "$29.95/mo"
    overt_benefit: "25 products, 100 checks/mo, full API, ROI dashboard, 4-hour support, forever history"
    dramatic_difference: "Build ModelOptix into your stack, prove value to leadership"
    fomo_trigger: "'No team features, no SSO, no dedicated support.' → Enterprise"
  all_tiers:
    - "10x better AND 10x cheaper than alternatives (10x/10x design gate)"
    - "Independent: No investors, no model partnerships, no hidden agendas"
    - "Week 1 payback for most users, 1000x return potential year one"

reasons_to_believe:
  proof_points:
    - proof: "10x/10x design gate (I only build if 10x better AND cheaper)"
      why: "Product discipline = quality guarantee"
    - proof: "Week 1 payback (most users recover annual cost in first week)"
      why: "Immediate ROI validation"
    - proof: "1000x return potential (year one for many users)"
      why: "Exponential value, not linear"
    - proof: "Structurally independent (no investors, no partners)"
      why: "Can't be compromised - it's structure, not policy"
    - proof: "I show my work (data sources, reasoning, confidence)"
      why: "Transparency builds trust"
    - proof: "7-day trial (fallback option, reverse trial model)"
      why: "Try before you pay"
    - proof: "Money-back guarantee"
      why: "Risk-free to commit"
    - proof: "20% off first year"
      why: "Lower risk to prove value"
    - proof: "Sanity check before switching"
      why: "Proof, not promises"
    - proof: "I use it myself (skin in the game)"
      why: "I'm a solopreneur too"

  kitchen_logic:
    - statement: "I don't take money from model providers - why would I steer you wrong?"
      factor: "Obvious incentive alignment"
    - statement: "If my recommendations sucked, you'd cancel. I only survive if you save."
      factor: "My success depends on yours"
    - statement: "I built this because I needed it for my own products first."
      factor: "I eat my own cooking"

  mechanism:
    - action: "I monitor 400+ models daily"
      result: "You don't have to"
    - action: "I alert you when better options appear"
      result: "You save money without effort"
    - action: "I show you alternatives for YOUR use case"
      result: "You see exactly what you're missing"
    - action: "I let you test before switching"
      result: "You switch with confidence"

communication:
  language_hypotheses:
    - they_say: "I'm probably overpaying"
      we_echo: "Stop overpaying"
    - they_say: "I don't have time to keep up"
      we_echo: "I keep up so you don't have to"
    - they_say: "I picked a model months ago"
      we_echo: "When did you last check?"
    - they_say: "There are too many options"
      we_echo: "I cut through the noise"
  validation_needed: "Early user interviews or community listening (X, Indie Hackers) to capture their real words."

  channels:
    - persona: "Solopreneur"
      primary: "X/Twitter"
      secondary: "Indie Hackers"
    - persona: "Indie Dev"
      primary: "Hacker News"
      secondary: "Reddit (r/LocalLLaMA)"
    - persona: "Startup CTO"
      primary: "Their devs bring it in"
      secondary: "LinkedIn"

  message_hierarchy:
    primary: "Stop overpaying for AI - see what you're missing in 2 minutes"
    support: "I monitor 400+ models so you don't have to"
    proof: "Independent. I work for you, not the model providers."
    action: "Try free for 7 days"

relationship_framework:
  philosophy: "I work for you. I find the savings, you decide what to do with them."

  trust_building:
    - action: "Show our data sources and reasoning"
      trust_built: "Transparency = credibility"
    - action: "Let them test before switching"
      trust_built: "Proof over promises"
    - action: "Be honest about what we don't know"
      trust_built: "Admitting limits builds trust"
    - action: "No upsell pressure"
      trust_built: "Respects their autonomy"

  helping_without_selling:
    - free_value: "Free tier shows real insights"
      why_works: "Proves value before commitment"
    - free_value: "Build in public - share learnings"
      why_works: "Builds audience and trust"
    - free_value: "Content that helps them understand the problem"
      why_works: "Educates, positions me as expert"
    - free_value: "Honest redirects when I'm not the fit"
      why_works: "Goodwill, they may refer others"

validation_priorities:
  - hypothesis: "Trust/Independence Angle"
    question: "Do customers actively distrust existing tools, or just find them inadequate?"
  - hypothesis: "Language/Phrases"
    question: "Are the 'They Say' phrases what they actually say?"
  - hypothesis: "Problem Severity"
    question: "Is 'portfolio drift' as painful as we assume?"

business_integration:
  product_design:
    - "Focus on 'first insight in 10 minutes' - that's the success threshold"
    - "Sanity check feature is differentiator - prioritize it"
    - "Self-serve only - no features that require hand-holding"
  marketing:
    - "Lead with savings ('stop overpaying') not independence"
    - "Independence is proof/trust builder, not the hook"
    - "Build in public on X and Indie Hackers"
  sales:
    - "No sales - product sells itself or it doesn't"
    - "Filter aggressively using green/red flags"
    - "Redirect gracefully when not a fit"
  support:
    - "Self-serve first - documentation over tickets"
    - "Admitting limits builds more trust than overpromising"
    - "Success = they stop worrying about model choices"
