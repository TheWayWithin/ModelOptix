business_rules:
  tier_limits:
    - id: "BR-001"
      rule: "Products limited by tier (Free: 1, Solo: 3, Growth: 10, Pro: 25)"
      enforcement: "Backend"
    - id: "BR-002"
      rule: "Functions limited by tier total (Free: 1, Solo: 10, Growth: 30, Pro: 100)"
      enforcement: "Backend"
    - id: "BR-003"
      rule: "Sanity checks limited per month by tier (Free: 0, Solo: 10, Growth: 30, Pro: 100)"
      enforcement: "Backend"
    - id: "BR-004"
      rule: "Usage counters reset on 1st of each month"
      enforcement: "Backend"
    - id: "BR-005"
      rule: "When adding item that uses last slot, show warning"
      enforcement: "Frontend"
    - id: "BR-006"
      rule: "When at limit, hard block with upgrade prompt"
      enforcement: "Frontend + Backend"

  trial_subscription:
    - id: "BR-007"
      rule: "Trial lasts 7 days with user-selected tier (Solo/Growth/Pro), defaults to Growth"
      enforcement: "Backend"
    - id: "BR-008"
      rule: "Trial requires credit card upfront"
      enforcement: "Stripe"
    - id: "BR-009"
      rule: "Card charged automatically on day 8 at selected tier price"
      enforcement: "Stripe"
    - id: "BR-010"
      rule: "Alternative: Skip trial, commit to annual, get 20% off first year"
      enforcement: "Backend + Stripe"
    - id: "BR-011"
      rule: "20% first year discount only applies to annual subscriptions"
      enforcement: "Backend"
    - id: "BR-012"
      rule: "All plans include money-back guarantee"
      enforcement: "Policy"
    - id: "BR-013"
      rule: "If trial cancelled before day 8, downgrade to Free"
      enforcement: "Backend + Stripe"
    - id: "BR-014"
      rule: "Free tier: 1 product, 1 function, 0 sanity checks, weekly alert digest only"
      enforcement: "Backend"

  # ADDED: Missing downgrade rules BR-015 to BR-018
  downgrade_behavior:
    - id: "BR-015"
      rule: "When downgrading, show impact summary: X products will be frozen, Y functions will be frozen"
      enforcement: "Frontend"
    - id: "BR-016"
      rule: "Frozen products/functions are read-only: can view, cannot edit, no new opportunities generated"
      enforcement: "Backend"
    - id: "BR-017"
      rule: "When user re-upgrades to sufficient tier, frozen items are instantly restored to active"
      enforcement: "Backend"
    - id: "BR-018"
      rule: "Cancelled subscription remains active until billing period end, then transitions to Free"
      enforcement: "Backend + Stripe"

  opportunity_recommendation:
    - id: "BR-019"
      rule: "Opportunities generated when: price change detected, new model available, trust score changes significantly"
      enforcement: "Backend"
    - id: "BR-020"
      rule: "Opportunity thresholds are configurable backend variables"
      enforcement: "Backend"
    - id: "BR-020a"
      rule: "Default thresholds: Cost >=15% AND >=$10/mo, Speed >=25%, Accuracy >=15%, Context >=2x, Trust >=15pts"
      enforcement: "Backend"
    - id: "BR-021"
      rule: "Opportunity status: active -> dismissed OR acted_on"
      enforcement: "Backend"
    - id: "BR-022"
      rule: "Dismissed opportunities can be restored within 30 days"
      enforcement: "Backend"
    - id: "BR-023"
      rule: "Savings recorded only when user confirms switch via Sanity Check flow"
      enforcement: "Backend"

  # ADDED: Missing alert rules BR-024 to BR-028
  alerts:
    - id: "BR-024"
      rule: "Free tier users receive weekly digest only, no real-time alerts"
      enforcement: "Backend"
    - id: "BR-025"
      rule: "Paid tier users (Solo/Growth/Pro) can receive real-time alerts via Email, Slack, Discord"
      enforcement: "Backend"
    - id: "BR-026"
      rule: "Alert types: new_opportunity, price_change, trust_change, new_model, model_deprecation"
      enforcement: "Backend"
    - id: "BR-027"
      rule: "Users can configure which alert types they receive and via which channels"
      enforcement: "Backend"
    - id: "BR-028"
      rule: "Clicking alert link marks it as read; 'Mark all as read' marks all current alerts as read"
      enforcement: "Backend"

  data_integrity:
    - id: "BR-029"
      rule: "Before confirming switch, re-validate opportunity is still valid"
      enforcement: "Backend"
    - id: "BR-030"
      rule: "Products must have at least 1 function"
      enforcement: "Backend"

data_model:
  entities:
    portfolio:
      - name: "User"
        attributes: "id, email, name, created_at, is_admin"
      - name: "Product"
        attributes: "id, user_id, name, description, status (active/frozen/deleted), created_at"
      - name: "Function"
        attributes: "id, product_id, name, description, current_model_id, current_provider_id, status (active/frozen/deleted)"
      - name: "UseCase"
        attributes: "id, function_id, description (free text), primary_need (speed/accuracy/cost/context), monthly_spend ($ or null)"

    model:
      - name: "ModelMaker"
        attributes: "id, name, website, description"
      - name: "Model"
        attributes: "id, model_maker_id, name, version, model_family, release_date, context_window, training_cutoff, is_open_source, description, deprecation_date"
      - name: "Provider"
        attributes: "id, name, website, api_base_url, regional_availability"
      - name: "ModelProviderPricing"
        attributes: "id, model_id, provider_id, input_price_per_1k, output_price_per_1k, batch_pricing, is_available, latency_estimate_ms, rate_limit_rpm, last_updated"
      - name: "Capability"
        attributes: "id, name, description"
      - name: "ModelCapability"
        attributes: "id, model_id, capability_id, strength_score (1-10)"

    trust:
      - name: "TrustDimension"
        attributes: "id, name, description, applies_to (model/provider), weight"
      - name: "ModelTrustScore"
        attributes: "id, model_id, dimension_id, score (0-100), evidence, confidence_level (High/Medium/Low), source_url, last_verified"
      - name: "ProviderTrustScore"
        attributes: "id, provider_id, dimension_id, score (0-100), evidence, confidence_level (High/Medium/Low), source_url, last_verified"

    action:
      - name: "Opportunity"
        attributes: "id, function_id, type, current_model_id, current_provider_id, primary_recommendation, alternatives[], status (active/viewed/sanity_checked/acted_on/dismissed), created_at, dismissed_at, dismissed_reason"
      - name: "SanityCheck"
        attributes: "id, user_id, function_id, opportunity_id, prompt_text, current_model_output, recommended_model_output, user_preference, created_at"
      - name: "Savings"
        attributes: "id, function_id, opportunity_id, previous_model_id, previous_provider_id, new_model_id, new_provider_id, monthly_savings_amount, switched_at"
      - name: "Alert"
        attributes: "id, user_id, type, title, message, related_entity_type, related_entity_id, is_read, created_at, sent_via[]"

    account:
      - name: "Subscription"
        attributes: "id, user_id, tier, status (trial/trial_cancelled/active/past_due/cancelled/free), stripe_customer_id, stripe_subscription_id, trial_ends_at, current_period_end, created_at"
      - name: "NotificationPreferences"
        attributes: "id, user_id, email_alerts, slack_webhook_url, discord_webhook_url, alert_types[], alert_frequency"
      - name: "UsageTracking"
        attributes: "id, user_id, month, products_count, functions_count, sanity_checks_used"
      # ADDED: Missing Session entity
      - name: "Session"
        attributes: "id, user_id, device, location, ip_address, last_active, created_at"

    # ADDED: Missing admin entities
    admin:
      - name: "AuditLog"
        attributes: "id, admin_id, action, affected_entity_type, affected_entity_id, previous_value, new_value, timestamp"
      - name: "PromotionCode"
        attributes: "id, code, discount_type (percentage/fixed), discount_amount, applicable_tiers[], usage_limit, per_user_limit, expiration_date, minimum_commitment (monthly/annual), status (active/inactive), created_at, usage_count"

# =============================================================================
# SECTION 6: TECHNICAL SPECIFICATIONS
# =============================================================================

tech_stack:
  auth_providers_mvp:
    - "google"
    - "github"
  auth_providers_post_mvp:
    - "microsoft"
    - "apple"
  data_sources:
    model_catalog:
      primary: "OpenRouter API"
      refresh: "daily"
    pricing:
      primary: "OpenRouter API"
      refresh: "daily"
    benchmarks:
      primary: "Artificial Analysis API"
      fallback: "Hugging Face"
      refresh: "weekly"
    latency:
      primary: "Own OpenRouter metrics"
      refresh: "realtime"
    trust_scores:
      primary: "Automated multi-source"
      refresh: "weekly"
  sanity_check_execution: "Server-side proxy"
  llm_provider: "OpenRouter"

recommendation_engine:
  fit_score_weights:
    cost:
      cost: 0.40
      speed: 0.15
      quality: 0.25
      trust: 0.15
      context: 0.05
    speed:
      cost: 0.15
      speed: 0.40
      quality: 0.25
      trust: 0.15
      context: 0.05
    accuracy:
      cost: 0.15
      speed: 0.10
      quality: 0.45
      trust: 0.20
      context: 0.10
    context:
      cost: 0.10
      speed: 0.10
      quality: 0.25
      trust: 0.15
      context: 0.40
  minimum_improvement_threshold: 0.10
  opportunity_thresholds:
    cost:
      percentage_min: 15
      absolute_min: 10
      unit: "$/month"
    speed:
      percentage_min: 25
    accuracy:
      percentage_min: 15
    context_window:
      multiplier_min: 2
    trust_score:
      points_min: 15

trust_scores:
  model_dimensions:
    - name: "Output Quality"
      weight: 0.40
      what_we_assess: "Accuracy, consistency, benchmark performance"
      data_source: "Artificial Analysis, Arena ELO, MMLU"
    - name: "Output Safety"
      weight: 0.35
      what_we_assess: "Guardrails, refusal rates, jailbreak resistance"
      data_source: "Safety benchmarks, incident reports"
    - name: "Training Transparency"
      weight: 0.25
      what_we_assess: "Openness about data, methods, limitations"
      data_source: "Provider documentation, model cards"
  provider_dimensions:
    - name: "Uptime"
      weight: 0.25
      what_we_assess: "Service availability, reliability"
      data_source: "Status pages, own monitoring"
    - name: "Data Privacy"
      weight: 0.25
      what_we_assess: "Logging policy, retention, training on inputs"
      data_source: "ToS analysis, privacy policies"
    - name: "API Stability"
      weight: 0.20
      what_we_assess: "Error rates, deprecation history, breaking changes"
      data_source: "Own metrics, changelog analysis"
    - name: "Pricing Transparency"
      weight: 0.15
      what_we_assess: "Clear pricing, no hidden fees, advance notice of changes"
      data_source: "Pricing pages, historical tracking"
    - name: "Support Quality"
      weight: 0.15
      what_we_assess: "Response times, documentation quality"
      data_source: "Community sentiment, own experience"
  combined_weights:
    model: 0.50
    provider: 0.50
  scale: "0-100"

# =============================================================================
# SECTION 7: MILESTONES & METRICS
# =============================================================================

milestones:
  - id: "M0a"
    name: "Pre-Launch Presence"
    definition: "Landing page live, waitlist capture working, 'taste of value' content published"
    track: "Marketing"
  - id: "M0b"
    name: "Infrastructure"
    definition: "DB, OAuth, Stripe, Email integrated, staging works"
    track: "Technical"
  - id: "M1"
    name: "Auth, Account & Billing"
    features: "F-001 to F-003, F-020 to F-023"
    definition: "complete signup-to-billing flow"
    track: "Technical"
  - id: "M2"
    name: "Portfolio Foundation"
    features: "F-004 to F-008"
    definition: "portfolio management"
    track: "Technical"
  - id: "M3"
    name: "Core Value Loop"
    features: "F-009 to F-016"
    definition: "opportunities, sanity check, trust"
    track: "Technical"
  - id: "M4"
    name: "Proof of Value"
    features: "F-017 to F-019"
    definition: "savings tracking, model comparison"
    track: "Technical"
  - id: "M5"
    name: "Trial Experience"
    definition: "Trial countdown visible, upgrade prompts at key moments, downgrade to free tier works"
    track: "Technical"
  - id: "M6"
    name: "Quality Complete"
    definition: "All P0 quality gates pass, internal testing done"
    track: "Technical"
  - id: "M7"
    name: "Launch Ready"
    definition: "Dogfooding complete (1-2 weeks), beta exit criteria met"
    track: "Technical"

# NEW: Milestone Dependencies (was missing)
milestone_dependencies:
  diagram: |
    M0a: Pre-Launch Presence ──────────────────────────────────┐
                                                               ├──→ M7: Launch Ready
    M0b: Infrastructure ──→ M1 ──→ M2 ──→ M3 ──→ M4 ──→ M5 ──→ M6 ──┘
  notes:
    - "M0a (Marketing) and M0b (Infrastructure) can run in parallel"
    - "M1-M6 are sequential - each builds on the previous"
    - "M7 requires both M0a (audience ready) and M6 (product ready)"
  phase_2_dependencies:
    - "Alerts (F-024 to F-026) require M3 complete (opportunities exist to alert on)"
    - "Natural Language Interface (F-027 to F-029) requires M2-M4 complete (needs data to query)"
    - "Admin (F-030 to F-035) can start after M1 (needs auth/user system)"

metrics:
  north_star:
    name: "Trust Engagement Rate"
    definition: "Users who view Trust Dashboard or Trust Reports for at least 1 product per month"
    target: "70% of paying users"
  supporting:
    name: "Savings Realized"
    definition: "Users who acted on recommendation and achieved measurable savings"
    target: "40% of paying users"
  funnel:
    - stage: "Awareness"
      metric: "Landing page visitors"
      target: "Baseline, +10% MoM"
    - stage: "Interest"
      metric: "Waitlist signups"
      target: "5% of visitors"
    - stage: "Activation"
      metric: "Trial starts"
      target: "50% of waitlist"
    - stage: "Engagement"
      metric: "Time to first value (savings shown)"
      target: "80% within 1 hour"
    - stage: "Conversion"
      metric: "Trial to Paid"
      target: "25% baseline, 45% stretch"
    - stage: "Revenue"
      metric: "ARPU"
      target: ">$15/mo"
    - stage: "Revenue"
      metric: "Annual vs monthly mix"
      target: ">70% annual"
    - stage: "Retention"
      metric: "Month 2 retention"
      target: "85%"
    - stage: "Retention"
      metric: "Gross monthly churn"
      target: "<4%"
    - stage: "Expansion"
      metric: "Net Revenue Retention"
      target: ">110%"
    - stage: "Expansion"
      metric: "Tier upgrades"
      target: "12% within 90 days"
  health_thresholds:
    time_to_first_insight:
      max: "10 minutes"
      action: "Simplify onboarding flow"
    day_1_login:
      min: 0.70
      action: "Review onboarding email timing"
    day_1_product_connection:
      min: 0.60
      action: "Review connection flow friction"
    day_6_7_login:
      min: 0.40
      action: "Improve trial re-engagement flow"
    data_freshness:
      max: "24 hours"
      action: "Alert ops team, check data pipelines"
    recommendation_accuracy:
      min: 0.85
      action: "Review scoring algorithms"
    payment_failure:
      max: 0.03
      action: "Improve dunning flow"
    refund_chargeback:
      max: 0.02
      action: "Review value delivery, investigate causes"

# NEW: Success Criteria by Tier (was missing - BOS-AI finding)
success_criteria_by_tier:
  free:
    - indicator: "First product added within 1 hour"
      target: "70%"
      timeframe: "First hour after signup"
    - indicator: "Upgrades to paid within 60 days"
      target: "15%"
      timeframe: "60 days"
    - indicator: "Reactivation to paid within 180 days"
      target: "20%"
      timeframe: "180 days"
  solo:
    - indicator: "Trust Dashboard view (monthly active)"
      target: "70%"
      timeframe: "Per month"
    - indicator: "Sanity check used in first 30 days"
      target: "60%"
      timeframe: "First 30 days"
    - indicator: "Upgrades to Growth within 90 days"
      target: "12%"
      timeframe: "90 days"
    - indicator: "12-month retention rate"
      target: "75%"
      timeframe: "12 months"
  growth:
    - indicator: "Week 1 payback achieved"
      target: "80%"
      timeframe: "First week"
    - indicator: "Acted on recommendation monthly"
      target: "50%"
      timeframe: "Per month"
    - indicator: "Upgrades to Pro within 6 months"
      target: "10%"
      timeframe: "6 months"
    - indicator: "12-month retention rate"
      target: "85%"
      timeframe: "12 months"
  pro:
    - indicator: "Renewal rate"
      target: "90%+"
      timeframe: "Annual"
    - indicator: "Expansion (team members - future)"
      target: "20%"
      timeframe: "Year 2"

quality_gates:
  - gate: "P0 Features Complete"
    criteria: "All 24 P0 features implemented and tested"
  - gate: "Critical Journeys Pass"
    criteria: "All 13 critical user journeys work end-to-end"
  - gate: "Integration Tests Pass"
    criteria: "All external integrations verified"
  - gate: "Edge Cases Handled"
    criteria: "Tier limits, payment, auth, data edge cases covered"
  - gate: "Compliance Verified"
    criteria: "GDPR/CCPA requirements met, audit logging active"
  - gate: "Performance Baseline"
    criteria: "Dashboard loads < 3s, Sanity Check completes < 30s"
  - gate: "Security Review"
    criteria: "Auth, payment, data handling reviewed"
  - gate: "Data Backup & Recovery"
    criteria: "Backup exists and restore process tested successfully"
  - gate: "Rollback Capability"
    criteria: "Can revert bad deploy in < 15 minutes, tested"
  - gate: "Graceful Degradation"
    criteria: "When dependencies fail (LLM/Stripe/OAuth), users see helpful errors"
  - gate: "Monitoring & Alerting"
    criteria: "Dashboards live, alerts configured, tested"
  - gate: "Rate Limiting Active"
    criteria: "Abuse prevention in place, tested against bot/bad actor scenarios"

# =============================================================================
# SECTION 8: UI STRUCTURE
# =============================================================================

ui_structure:
  main_navigation:
    - item: "Dashboard"
      route: "/dashboard"
      description: "Overview, Savings to Date, recent activity"
    - item: "Portfolio"
      route: "/portfolio"
      description: "Products and functions"
    - item: "Trust"
      route: "/trust"
      description: "Trust scores and reports"
    - item: "Opportunities"
      route: "/opportunities"
      description: "Recommendations (Sanity Check embedded)"
    - item: "Compare"
      route: "/compare"
      description: "Side-by-side model comparison"
    - item: "Alerts"
      route: "/alerts"
      description: "Notifications"
  core_ui_component:
    name: "Natural Language Interface"
    element: "Command Bar"
    trigger: "Cmd+K or always visible"
    capabilities:
      - "Navigate"
      - "Query"
      - "Explain"
      - "Act"

# =============================================================================
# SECTION 9: COMPLIANCE & PRIVACY
# =============================================================================

compliance:
  gdpr:
    applies_when: "EU users"
    obligations:
      - "Data export"
      - "Deletion on request"
      - "Consent"
      - "DPA"
  ccpa:
    applies_when: "California users"
    obligations:
      - "Opt-out mechanism"
      - "Disclosure"
  user_rights:
    - right: "Access"
      support: "Export all my data"
    - right: "Deletion"
      support: "Delete my account and all data"
    - right: "Correction"
      support: "Edit account information"
    - right: "Portability"
      support: "Export in standard format"
  data_retention:
    account_data: "Account lifetime + 30 days after deletion"
    prompts: "90 days (or until user deletes)"
    savings_history: "Account lifetime"
    usage_analytics: "2 years"
    audit_logs: "2 years"

# NEW: Additional Privacy & Compliance Requirements (BOS-AI finding)
additional_compliance:
  prompt_data_disclosure:
    warning_text: "Your prompt will be sent to [provider]. Do not include PII or sensitive data."
    acknowledgment_required: true
    when_shown: "Before first Sanity Check and when provider changes"

  third_party_data_processing:
    - provider_type: "LLM Providers (OpenAI, Anthropic, etc.)"
      requirement: "Maintain Data Processing Agreements (DPAs)"
      documentation: "List specific providers in Privacy Policy"
    - provider_type: "Payment Processor (Stripe)"
      requirement: "PCI DSS compliance, no raw card data on our servers"
      documentation: "Reference Stripe's compliance in Privacy Policy"

  data_confidentiality:
    - data_type: "Portfolio Data"
      classification: "Confidential"
      restrictions:
        - "Never share with third parties"
        - "Never sell"
        - "Never use for marketing"
        - "State explicitly in Privacy Policy"
    - data_type: "Prompts/Outputs"
      classification: "Confidential"
      restrictions:
        - "Only shared with selected LLM provider for execution"
        - "Not retained by ModelOptix beyond 90 days"
        - "Not used to train any models"

  disclaimers:
    - name: "Trust Score Disclaimer"
      text: "Trust scores are ModelOptix assessments based on available data. They are not guarantees of model or provider behavior."
      location: "Terms of Service, Trust Dashboard footer"
    - name: "Savings Disclaimer"
      text: "Estimated savings are based on user-provided monthly spend and may vary based on actual usage patterns."
      location: "Savings Dashboard footer"

  audit_logging:
    required: true
    what_to_log:
      - "Admin user actions"
      - "Trust score changes"
      - "Subscription modifications by admin"
      - "User impersonation events"
      - "Data export requests"
      - "Account deletion requests"
    retention_period: "2 years"

# =============================================================================
# SECTION 10: PRICING
# =============================================================================

pricing:
  model: "subscription"
  tiers:
    free:
      price_annual: 0
      price_monthly: 0
      products: 1
      functions: 1
      sanity_checks: 0
      alerts: "weekly digest only"
      history: "7 days"
    solo:
      price_annual: 9.95
      price_monthly: 13.45
      products: 3
      functions: 10
      sanity_checks: 10
      alerts: "real-time"
      history: "90 days"
      webhooks: false
    growth:
      price_annual: 19.95
      price_monthly: 26.95
      products: 10
      functions: 30
      sanity_checks: 30
      alerts: "real-time"
      history: "1 year"
      webhooks: true
