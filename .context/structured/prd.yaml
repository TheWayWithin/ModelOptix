# NEW: Critical User Journeys (was missing)
critical_journeys:
  - name: "New User to First Savings"
    description: "Complete flow from signup through first recorded savings"
    features_involved: ["F-001", "F-004", "F-005", "F-006", "F-009", "F-011", "F-012"]
    success_criteria: "User signs up, adds product/function, sees opportunity, runs sanity check, confirms switch, sees savings"

  - name: "Trial to Paid Conversion"
    description: "Automatic conversion at trial end"
    features_involved: ["F-001", "F-021"]
    success_criteria: "User completes trial, card charged on day 8, access continues"

  - name: "Upgrade/Downgrade"
    description: "Tier change flows"
    features_involved: ["F-021"]
    success_criteria: "User upgrades (immediate access), user downgrades (freezes at period end)"

  - name: "Trust Investigation"
    description: "Deep dive into trust scores"
    features_involved: ["F-014", "F-015", "F-016"]
    success_criteria: "User sees trust scores, drills into details, understands evidence"

  - name: "Model Discovery"
    description: "Find right model for use case"
    features_involved: ["F-019"]
    success_criteria: "User describes use case, gets recommendations, compares models"

  - name: "Alert Response"
    description: "Act on alert notification"
    features_involved: ["F-024", "F-025", "F-010"]
    success_criteria: "User receives alert, clicks through, lands on relevant opportunity"

  - name: "Account Deletion"
    description: "Clean account removal"
    features_involved: ["F-020"]
    success_criteria: "User exports data, confirms deletion, all data removed, savings preserved in aggregate"

  - name: "Proactive Opportunity Review"
    description: "User-initiated opportunity exploration"
    features_involved: ["F-007", "F-009", "F-010"]
    success_criteria: "User checks Portfolio, sees opportunity indicator, investigates, acts"

  - name: "Update Use Case"
    description: "Modify function requirements"
    features_involved: ["F-007", "F-006"]
    success_criteria: "User edits function's use case, opportunities re-evaluated"

  - name: "Add New Feature"
    description: "Expand portfolio"
    features_involved: ["F-005", "F-006"]
    success_criteria: "User adds function to existing product, defines use case, gets recommendations"

  - name: "No Opportunities Found"
    description: "Handle already-optimized state"
    features_involved: ["F-004", "F-005", "F-006", "F-007"]
    success_criteria: "User adds product/function but no opportunities exist; sees helpful explanation, trust maintained"

  - name: "Billing Issue Resolution"
    description: "Payment failure recovery"
    features_involved: ["F-022", "F-021"]
    success_criteria: "Payment fails, user notified, updates card, subscription restored without data loss"

  - name: "Recommendation Rejection"
    description: "Decline recommendation gracefully"
    features_involved: ["F-010", "F-013"]
    success_criteria: "User views opportunity, dismisses it; system records feedback, can restore later, user stays engaged"

# NEW: Edge Cases & Boundary Conditions (was missing)
edge_cases:
  tier_limits:
    - scenario: "User at product limit minus 1, adds product"
      expected_behavior: "Warning shown, product added"
    - scenario: "User at product limit, tries to add"
      expected_behavior: "Blocked with upgrade prompt"
    - scenario: "User at function limit minus 1, adds function"
      expected_behavior: "Warning shown, function added"
    - scenario: "User at function limit (total), tries to add"
      expected_behavior: "Blocked with upgrade prompt"
    - scenario: "User at sanity check limit, tries to run"
      expected_behavior: "Blocked with upgrade prompt"
    - scenario: "Free user tries sanity check"
      expected_behavior: "Blocked (0 allowed)"
    - scenario: "User upgrades tier mid-session"
      expected_behavior: "New limits reflected immediately without re-login"
    - scenario: "User downgrades tier mid-session"
      expected_behavior: "Current limits remain until period end, visual indicator of pending change"

  tier_features:
    - scenario: "Free user tries to connect Slack/Discord"
      expected_behavior: "Blocked with upgrade prompt"
    - scenario: "Free user tries to enable real-time alerts"
      expected_behavior: "Blocked, shown 'Weekly digest only on Free'"
    - scenario: "Free user accesses Alerts page"
      expected_behavior: "Shows weekly digest history only, upgrade prompt for real-time"
    - scenario: "User on any tier accesses P1 feature before launch"
      expected_behavior: "Feature hidden or 'Coming soon' message"

  authentication:
    - scenario: "OAuth fails mid-signup"
      expected_behavior: "Error message, option to retry or try different provider"
    - scenario: "User completes OAuth but abandons before card capture"
      expected_behavior: "Account created but incomplete; blocked from protected pages; can resume"
    - scenario: "OAuth token expires during session"
      expected_behavior: "Prompt to re-authenticate, session preserved"
    - scenario: "OAuth provider revokes access"
      expected_behavior: "Prompt to re-link or use different provider"
    - scenario: "Brute force login attempts"
      expected_behavior: "Rate limiting after 5 failed attempts, temporary lockout, CAPTCHA"
    - scenario: "Multiple OAuth providers same email"
      expected_behavior: "Reject with message: 'Account already exists with this email via [provider]'"
    - scenario: "User deletes their OAuth account (e.g., GitHub)"
      expected_behavior: "Next login fails; prompt to contact support or link different provider"
    - scenario: "Deleted user attempts access with cached token"
      expected_behavior: "Token invalidated, access denied, redirect to login"

  payment:
    - scenario: "Trial ends day 8, valid card"
      expected_behavior: "Card charged, subscription active"
    - scenario: "Trial ends day 8, card declined"
      expected_behavior: "Retry 3x, then downgrade to Free"
    - scenario: "User cancels during trial"
      expected_behavior: "Immediate downgrade to Free, no charge"
    - scenario: "User cancels paid subscription"
      expected_behavior: "Active until period end, then Free"
    - scenario: "Downgrade with products over new limit"
      expected_behavior: "Show impact, freeze excess at period end"
    - scenario: "Payment method expires"
      expected_behavior: "Notify user, retry, eventually Free"
    - scenario: "Promo code applied at checkout"
      expected_behavior: "Discount shown, applied to charge"
    - scenario: "Invalid/expired promo code"
      expected_behavior: "Clear error, no discount"
    - scenario: "Annual user cancels within 30 days of signup"
      expected_behavior: "Full refund issued, downgrade to Free"
    - scenario: "Trial user cancels within 30 days of trial start (post day-8 charge)"
      expected_behavior: "Full refund issued, downgrade to Free"
    - scenario: "User requests refund after 30-day guarantee period"
      expected_behavior: "No refund, active until period end, then Free"
    - scenario: "User files chargeback"
      expected_behavior: "Immediate account suspension, access revoked"
    - scenario: "User requests second 30-day refund (lifetime)"
      expected_behavior: "Denied - one guarantee per customer"
    - scenario: "Same payment method used for second trial"
      expected_behavior: "Blocked - 1 trial per payment method"

  data:
    - scenario: "User deletes function with savings history"
      expected_behavior: "Function removed, savings preserved (orphaned), counts toward total"
    - scenario: "User deletes only function on product"
      expected_behavior: "Product remains, flagged incomplete"
    - scenario: "Opportunity becomes invalid after user views"
      expected_behavior: "Re-validate on action, show 'no longer valid'"
    - scenario: "Model deprecated while user has it assigned"
      expected_behavior: "Alert sent, opportunity generated to switch"
    - scenario: "Trust score changes significantly"
      expected_behavior: "Alert sent, opportunities re-evaluated"
    - scenario: "New user, no data yet"
      expected_behavior: "Onboarding flow, helpful empty state with prompts to add first product"
    - scenario: "All opportunities completed/dismissed"
      expected_behavior: "'All optimized' empty state with encouragement"
    - scenario: "New model added with no trust score"
      expected_behavior: "Displayed as 'Trust score pending' or 'Not yet assessed', user can still assign"
    - scenario: "User deletes product with multiple functions"
      expected_behavior: "Confirmation shows cascade impact, all child data removed, savings preserved"
    - scenario: "User account deleted"
      expected_behavior: "PII anonymized, aggregate savings preserved for reporting, data removed within 30 days"

