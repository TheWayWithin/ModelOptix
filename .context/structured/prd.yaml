# NEW: Glossary section (was missing)
glossary:
  - term: "Product"
    definition: "An AI-powered application or service the user is building (e.g., 'Trader-7 Bot', 'Support Chat')"
  - term: "Function"
    definition: "A distinct AI capability within a product (e.g., 'Sentiment Analysis', 'Code Generation')"
  - term: "Use Case"
    definition: "The specific requirements for a function (primary need, monthly spend, constraints)"
  - term: "Model"
    definition: "An AI model (e.g., GPT-4, Claude 3.5 Sonnet)"
  - term: "Model Maker"
    definition: "The company that created the model (e.g., OpenAI, Anthropic)"
  - term: "Provider"
    definition: "A service offering API access to models (e.g., OpenRouter, direct from OpenAI)"
  - term: "Capability"
    definition: "A specific skill or feature of a model (e.g., 'code generation', 'multilingual')"
  - term: "Trust Score"
    definition: "A 0-100 rating assessing model or provider trustworthiness across multiple dimensions"
  - term: "Trust Dimension"
    definition: "A specific aspect of trust being measured (e.g., 'Output Safety', 'Data Privacy')"
  - term: "Opportunity"
    definition: "A recommendation to switch models based on detected improvement potential"
  - term: "Savings"
    definition: "The recorded cost reduction when a user confirms a model switch"
  - term: "Sanity Check"
    definition: "A test comparing current vs recommended model output using the user's actual prompts"
  - term: "Alert"
    definition: "A notification about price changes, new models, or trust score updates"
  - term: "Portfolio"
    definition: "The collection of all products and functions a user is tracking"

# NEW: State Machines section (was missing - HIGH PRIORITY)
state_machines:
  - name: "Subscription State Machine"
    entity: "Subscription"
    states:
      - name: "trial"
        description: "User is in 7-day trial period with full tier access"
      - name: "trial_cancelled"
        description: "User cancelled during trial, downgrading to free at trial end"
      - name: "active"
        description: "Paid subscription is active"
      - name: "past_due"
        description: "Payment failed, in grace period with retry attempts"
      - name: "cancelled"
        description: "User cancelled, active until period end then moves to free"
      - name: "free"
        description: "Free tier with limited features"
    transitions:
      - from: "trial"
        to: "active"
        trigger: "Day 8 payment succeeds"
        description: "Automatic conversion when trial ends and card charges successfully"
      - from: "trial"
        to: "trial_cancelled"
        trigger: "User cancels during trial"
        description: "User explicitly cancels, no charge, continues until trial end"
      - from: "trial_cancelled"
        to: "free"
        trigger: "Trial period ends"
        description: "Automatic downgrade when cancelled trial expires"
      - from: "trial"
        to: "free"
        trigger: "Day 8 payment fails after retries"
        description: "Card declined 3x, automatic downgrade"
      - from: "active"
        to: "past_due"
        trigger: "Renewal payment fails"
        description: "Card declined, enters grace period"
      - from: "past_due"
        to: "active"
        trigger: "Payment succeeds"
        description: "User updates card or retry succeeds"
      - from: "past_due"
        to: "free"
        trigger: "All retries exhausted"
        description: "After 3 retries over 14 days, downgrade to free"
      - from: "active"
        to: "cancelled"
        trigger: "User cancels"
        description: "User requests cancellation, remains active until period end"
      - from: "cancelled"
        to: "free"
        trigger: "Period ends"
        description: "Automatic downgrade when paid period expires"
      - from: "free"
        to: "trial"
        trigger: "User starts trial"
        description: "Free user upgrades to trial (1 trial per payment method)"

  - name: "Opportunity State Machine"
    entity: "Opportunity"
    states:
      - name: "active"
        description: "Opportunity is available for user action"
      - name: "viewed"
        description: "User has viewed the opportunity details"
      - name: "sanity_checked"
        description: "User has run a sanity check on this opportunity"
      - name: "acted_on"
        description: "User confirmed the switch, savings recorded"
      - name: "dismissed"
        description: "User dismissed the opportunity"
    transitions:
      - from: "active"
        to: "viewed"
        trigger: "User opens opportunity detail"
        description: "Tracks engagement"
      - from: "viewed"
        to: "sanity_checked"
        trigger: "User runs sanity check"
        description: "User testing recommendation"
      - from: "sanity_checked"
        to: "acted_on"
        trigger: "User confirms switch"
        description: "Savings recorded, opportunity closed"
      - from: "active"
        to: "dismissed"
        trigger: "User dismisses"
        description: "Can be restored within 30 days"
      - from: "viewed"
        to: "dismissed"
        trigger: "User dismisses"
        description: "Can be restored within 30 days"
      - from: "sanity_checked"
        to: "dismissed"
        trigger: "User dismisses after sanity check"
        description: "User tested but decided not to switch"

  - name: "Product/Function State Machine"
    entity: "Product"
    states:
      - name: "active"
        description: "Product/function is within tier limits, fully functional"
      - name: "frozen"
        description: "Product/function exceeds tier limits, read-only"
      - name: "deleted"
        description: "User deleted the product/function"
    transitions:
      - from: "active"
        to: "frozen"
        trigger: "Tier downgrade causes limit exceeded"
        description: "Excess products frozen, can view but not edit or get new opportunities"
      - from: "frozen"
        to: "active"
        trigger: "User upgrades tier"
        description: "Instant restoration when limits allow"
      - from: "active"
        to: "deleted"
        trigger: "User deletes"
        description: "Soft delete, savings history preserved"
      - from: "frozen"
        to: "deleted"
        trigger: "User deletes"
        description: "Soft delete, savings history preserved"

