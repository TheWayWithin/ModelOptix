      - name: "DPA Acknowledgment"
        success_criteria: "Separate DPA consent for third-party LLM processing accepted"
      - name: "LLM Provider Disclosure"
        success_criteria: "Specific LLM provider name shown before prompt sent"
      - name: "Prompt Data Warning"
        success_criteria: "Warning shown and acknowledged before prompt sent"
      - name: "CCPA Opt-Out"
        success_criteria: "'Do Not Sell' mechanism works, choice respected"
      - name: "Cookie Consent"
        success_criteria: "Consent banner shown, choice respected"
      - name: "Payment Data Isolation (PCI)"
        success_criteria: "No raw card data touches our systems"
      - name: "Admin Audit Log"
        success_criteria: "Action logged with who, what, when"

