# Schema-compliant problem section (was problem_statement)
problem:
  core: "Developers pick an AI model, ship it, and then 6 months later they're probably overpaying - but can't justify stopping to re-evaluate. Meanwhile, 400+ models are constantly changing with no unbiased source to cut through the noise."
  symptoms:
    - "400+ models and growing - impossible to track manually"
    - "Constant price changes with no central notification system"
    - "Every existing tool has hidden incentives (volume routing, affiliate deals, vendor relationships)"
    - "Developers making decisions on 3-6 month old information"
  cycle:
    - "Pick model based on available info"
    - "Ship and move on to other priorities"
    - "Months pass, landscape changes"
    - "No time/incentive to re-evaluate"
    - "Quietly overpaying or underperforming"
  cost: "Quietly bleeding 20-40% overspend every month, falling behind competitors who optimize their AI stack, background anxiety about 'am I doing this right?', missing better models that could improve their product"

