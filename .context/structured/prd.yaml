      acceptance_criteria:
        - "Given I click 'Start Free Trial', When I'm on checkout, Then I see tier selection with Growth pre-selected"
        - "Given I select a tier, When I proceed, Then I see pricing summary with trial terms (7 days free, then $X/mo)"
        - "Given I'm on payment, When I enter card details, Then card is validated and stored via Stripe"
        - "Given I complete payment setup, When I continue, Then I'm prompted to sign up via OAuth (Google/GitHub)"
        - "Given I complete OAuth, When signup succeeds, Then I land on Dashboard with empty state and onboarding prompts"
        - "Given I'm a returning visitor who abandoned signup, When I return, Then I can resume where I left off"
      touched_entities: ["User", "Subscription", "UsageTracking"]

    - id: "F-002"
      name: "Returning User Login"
      description: "Quick authentication for existing users"
