success_metrics:
  - metric: "Trial to Paid Conversion"
    target: "> 45%"
    measurement: "Stripe data"
  - metric: "Week 1 Payback"
    target: "> 80% of users"
    measurement: "Savings Dashboard"
  - metric: "Monthly Churn"
    target: "< 4%"
    measurement: "Subscription analytics"
  - metric: "Time to First Insight"
    target: "< 10 minutes"
    measurement: "Product analytics"
  - metric: "NPS"
    target: "> 50"
    measurement: "Survey"
  - metric: "Users Acting on Recommendations"
    target: "> 30%"
    measurement: "Product analytics"

out_of_scope_mvp:
  - item: "Local/self-hosted models (Ollama, LocalAI)"
    reason: "MVP uses OpenRouter as data source and execution layer. Local models aren't accessible via OpenRouter."
  - item: "Enterprise features (SSO, team management, audit logs)"
    reason: "Targeting solopreneurs/indie devs for MVP. Enterprise features planned for Phase 4."
  - item: "Direct provider integrations"
    reason: "MVP routes through OpenRouter. Direct integrations may be added post-MVP."
  - item: "Custom model fine-tuning tracking"
    reason: "MVP focuses on base models available via OpenRouter."
  - item: "Usage prediction/forecasting"
    reason: "MVP shows current state and opportunities. Predictive analytics is Phase 3+."
