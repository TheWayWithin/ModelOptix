# SECTION VII: IMPLEMENTATION FRAMEWORK (PREVIOUSLY MISSING)
# ============================================================

implementation_framework:
  development_methodology:
    approach: "Two-System Approach"
    systems:
      - name: "BOS-AI"
        purpose: "Business strategy, requirements, PRDs"
        output: "What to build and why"
      - name: "Agent-11"
        purpose: "Technical development with Claude Code"
        output: "Working software"
    workflow: "BOS-AI (strategy/requirements) → PRD handoff → Agent-11 (build) → Working product → BOS-AI (operate, gather feedback) → New requirements → Agent-11 (iterate)"

  build_cadence:
    total_cycle: "5-7 weeks from PRD to mature product"
    phases:
      - phase: "Requirements (BOS-AI)"
        duration: "1-2 days"
        focus: "PRD, user stories, acceptance criteria"
      - phase: "Build (Agent-11)"
        duration: "~1 week"
        focus: "Scalable MVP"
      - phase: "Test & Mature"
        duration: "3-4 weeks"
        focus: "Bug fixes, edge cases, polish"
      - phase: "Launch"
        duration: "1 week"
        focus: "GTM execution, monitoring"

  phase_implementation:
    - phase_id: "phase_0"
      tasks:
        - task: "Landing page"
          approach: "Agent-11 build or no-code (Framer, Webflow)"
          time: "1-2 days"
        - task: "Email capture"
          approach: "Waitlist tool (Loops, ConvertKit, simple form)"
          time: "1 hour"
        - task: "Analytics"
          approach: "Plausible, Fathom, or simple tracking"
          time: "1 hour"
        - task: "Build in public setup"
          approach: "WIP.co account, X/Twitter ready"
          time: "1 hour"
        - task: "First announcement post"
          approach: "Write and publish"
          time: "1 hour"

    - phase_id: "phase_1"
      components:
        - component: "Trust Dashboard"
          approach: "Agent-11"
          priority: "P0 - Core value"
        - component: "Opportunities Dashboard"
          approach: "Agent-11"
          priority: "P0 - Core value"
        - component: "Model Comparison"
          approach: "Agent-11"
          priority: "P0 - Core value"
        - component: "Sanity Check"
          approach: "Agent-11"
          priority: "P0 - Core value"
        - component: "Basic Alerts"
          approach: "Agent-11"
          priority: "P0 - Core value"
        - component: "Auth + Billing"
          approach: "Stripe + Auth provider"
          priority: "P0 - Revenue"
        - component: "Onboarding flow"
          approach: "Agent-11"
          priority: "P1 - Activation"
      test_mature:
        - "Alpha users (hand-picked from waitlist)"
        - "Daily feedback loops"
        - "Bug fixes and edge cases"
        - "Performance optimization"
        - "Onboarding refinement"
      launch_sequence:
        - "Product Hunt"
        - "Hacker News"
        - "Indie Hackers"
        - "Build in public announcement"

    - phase_id: "phase_2"
      components:
        - component: "Savings Dashboard"
          approach: "1 week build + 2 weeks mature"
          priority: "P0"
        - component: "Trust Alerts"
          approach: "1 week build + 2 weeks mature"
          priority: "P0"
        - component: "Cost Anomaly Detection"
          approach: "1 week build + 2 weeks mature"
          priority: "P1"
        - component: "Router"
          approach: "3-4 weeks build + 6-8 weeks mature"
          priority: "P0"
          notes: "Requires robust infrastructure (uptime critical), usage-based billing integration"

    - phase_id: "phase_3"
      components:
        - component: "Marketplace infrastructure"
          approach: "Agent-11 + contractors"
          priority: "P0"
        - component: "Provider dashboard"
          approach: "Agent-11"
          priority: "P1"
        - component: "Certification program"
          approach: "Process + tech"
          priority: "P1"
        - component: "Integration ecosystem"
          approach: "Agent-11 + community"
          priority: "P2"

  market_validation:
    loop:
      - "Ship small - Release early, learn fast"
      - "Talk to users - Regular interviews, not just metrics"
      - "Measure what matters - Focus on activation and retention, not vanity"
      - "Iterate weekly - Small improvements compound"
      - "Kill what doesn't work - No attachment to features that don't perform"
    decision_points:
      - decision: "Continue building MVP"
        criteria: "Waitlist > 500, positive interview feedback"
        action: "Proceed to Alpha"
      - decision: "Launch publicly"
        criteria: "Alpha NPS > 40, core flows working"
        action: "Go to Product Hunt, HN"
      - decision: "Build Router"
        criteria: "Core product validated, demand signals"
        action: "Start Router PRD"
      - decision: "Hire/contract help"
        criteria: "Revenue supports it, you're the bottleneck"
        action: "Targeted contractor"
      - decision: "Build Platform"
        criteria: "Router working, enterprise interest"
        action: "Start Platform PRD"

# ============================================================
# SECTION VIII: DECISION FRAMEWORK (PREVIOUSLY MISSING)
# ============================================================

decision_framework:
  decision_points:
    - name: "Phase 0 → Phase 1 (Start Building MVP)"
      criteria:
        - criterion: "Waitlist signups"
          green_light: "> 500"
          yellow_light: "200-500"
          red_light: "< 200"
        - criterion: "User interviews"
          green_light: "Clear pain, would pay"
          yellow_light: "Interested but vague"
          red_light: "No urgency"
        - criterion: "Payment intent"
          green_light: "> 50 pre-commits"
          yellow_light: "20-50 pre-commits"
          red_light: "< 20"
        - criterion: "Positioning clarity"
          green_light: "Users explain it back"
          yellow_light: "Some confusion"
          red_light: "Total confusion"
      green_action: "Proceed to MVP build immediately"
      yellow_action: "Iterate messaging, do more interviews, keep validating"
      red_action: "Fundamental rethink - wrong audience, wrong problem, or wrong solution"

    - name: "Alpha → Public Launch"
      criteria:
        - criterion: "Alpha NPS"
          green_light: "> 50"
          yellow_light: "30-50"
          red_light: "< 30"
        - criterion: "Core flows working"
          green_light: "Smooth, minimal bugs"
          yellow_light: "Some friction"
          red_light: "Broken"
        - criterion: "Week-1 payback"
          green_light: "> 80% of users"
          yellow_light: "50-80%"
          red_light: "< 50%"
        - criterion: "Alpha churn"
          green_light: "< 10%"
          yellow_light: "10-20%"
          red_light: "> 20%"
      green_action: "Launch on Product Hunt, HN, Indie Hackers"
      yellow_action: "Fix issues, extend alpha, iterate"
      red_action: "Major product rethink before public exposure"

    - name: "Core → Router (Start Second Product)"
      criteria:
        - criterion: "Core MRR"
          green_light: "> $10K"
          yellow_light: "$5-10K"
          red_light: "< $5K"
        - criterion: "Monthly churn"
          green_light: "< 4%"
          yellow_light: "4-6%"
          red_light: "> 6%"
        - criterion: "User requests for API/routing"
          green_light: "Regular"
          yellow_light: "Occasional"
          red_light: "None"
        - criterion: "Capacity"
          green_light: "You're not drowning"
          yellow_light: "Busy but manageable"
          red_light: "Overwhelmed"
      green_action: "Start Router PRD, begin build"
      yellow_action: "Focus on Core growth and retention first"
      red_action: "Core product needs work - don't split focus"

    - name: "Solo → Team (Hire/Contract)"
      criteria:
        - criterion: "Revenue"
          green_light: "Covers salary + runway"
          yellow_light: "Tight but possible"
          red_light: "Can't afford it"
        - criterion: "Bottleneck"
          green_light: "You're limiting growth"
          yellow_light: "Some friction"
          red_light: "Managing fine"
        - criterion: "Type of help needed"
          green_light: "Clear, scoped"
          yellow_light: "Vague"
          red_light: "Don't know"
      green_action: "Hire contractor for specific capability"
      yellow_action: "Wait, or find cheaper solution (tools, automation)"
      red_action: "Stay solo, focus on revenue first"

  acceleration_triggers:
    - signal: "Signups 2x target"
      action: "Increase marketing investment"
    - signal: "Trial conversion > 50%"
      action: "Raise prices or add higher tier"
    - signal: "Organic referrals > 20%"
      action: "Build referral program with incentives"
    - signal: "NPS > 70"
      action: "Double down on testimonials, case studies"
    - signal: "Enterprise inbound"
      action: "Create enterprise tier, start sales motion"

  investigation_triggers:
    - signal: "High signups, low activation"
      investigation: "UX research - where's the friction?"
    - signal: "High activation, low conversion"
      investigation: "Value perception or pricing problem"
    - signal: "High conversion, high churn"
      investigation: "Product not delivering promised value"
    - signal: "Low referrals despite good NPS"
      investigation: "Sharing mechanism broken or missing"
    - signal: "Tier distribution wrong"
      investigation: "Pricing page or feature allocation issue"

  pivot_triggers:
    - signal: "< 200 waitlist after 8 weeks"
      consideration: "Wrong audience, channel, or message"
    - signal: "< 25% action on recommendations"
      consideration: "Core value prop not working"
    - signal: "0 conversions after 60 days"
      consideration: "Fundamental product-market fit problem"
    - signal: "Negative NPS"
      consideration: "Wrong market or wrong solution"
    - signal: "Independence not mentioned"
      consideration: "Differentiation not resonating"

  pivot_options:
    - type: "Audience pivot"
      description: "Same product, different target (e.g., enterprises instead of solopreneurs)"
    - type: "Problem pivot"
      description: "Same audience, different problem (e.g., compliance instead of cost)"
    - type: "Solution pivot"
      description: "Same problem, different approach (e.g., consulting instead of SaaS)"
    - type: "Channel pivot"
      description: "Same everything, different GTM (e.g., content instead of communities)"

  roadmap_revision:
    triggers:
      - trigger: "Major pivot decision"
        action: "Full roadmap revision"
      - trigger: "Phase transition"
        action: "Review and update next phase details"
      - trigger: "Market shift (e.g., new regulation)"
        action: "Assess impact, update if significant"
      - trigger: "Competitor move (e.g., OpenRouter adds trust)"
        action: "Reassess differentiation"
      - trigger: "Quarterly review"
        action: "Light refresh, update timelines"
    no_revision_needed:
      - "Tactical feature prioritization changes"
      - "Timeline shifts of a few weeks"
      - "Minor pricing adjustments"
      - "Channel experiments"

  adaptation_framework:
    cadence:
      - frequency: "Weekly"
        focus: "Review metrics, user feedback, adjust tactics"
      - frequency: "Monthly"
        focus: "Review progress against milestones, adjust priorities"
      - frequency: "Quarterly"
        focus: "Review strategic direction, update roadmap if needed"
      - frequency: "Annually"
        focus: "Full strategic review, major roadmap update"
    principle: "Stay committed to the vision (Independent AI Intelligence), flexible on the path."

