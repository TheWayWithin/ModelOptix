metadata:
  version: "1.0"
  date: "January 7, 2026"
  purpose: "Strategic roadmap from Vision to Great through keystone product development"

# ============================================================
# SECTION I: STRATEGIC FOUNDATION
# ============================================================

strategic_foundation:
  vision: "To be the unbiased guide in a world where AI serves hidden interests."
  vision_elaboration: "When AI can do everything instantly, the scarce resource isn't time - it's trust. We exist to ensure people always know what's truly best for them - not what profits someone else."
  mission: "Through radical transparency and independent analysis, we help developers optimize their AI stack today - building the foundation for AI truth everyone can trust tomorrow."
  mission_elaboration: "We start with developers and solopreneurs choosing LLMs, but our mission extends to anyone who needs to know: whose interests does this AI really serve?"
  hedgehog_concept: "We are solopreneurs building truly independent AI intelligence for solopreneurs - growing by delivering so much value to indie hackers that they can't help but spread the word."
  value_proposition: "For developers and solopreneurs building LLM-powered products who face an overwhelming, constantly-changing AI landscape with no unbiased guidance - we are an independent AI model advisor that continuously monitors your LLM stack and proactively recommends optimizations with full transparency on what's best for YOU, not us."

# ============================================================
# SECTION I: PROBLEM-SOLUTION MAPPING (Enhanced with solution_gaps + unique_angle)
# ============================================================

problem_categories:
  - name: "Portfolio Drift"
    specific_problems:
      - "Research decay - picked a model months ago, haven't re-evaluated since"
      - "Overpaying by 20-40% without realizing it"
      - "Decisions based on stale information (3-6 months old)"
      - "Background anxiety - 'am I doing this right?' without time to check"
    impact:
      financial: "Quietly bleeding money every month on suboptimal choices"
      competitive: "Falling behind competitors who optimize their AI stack"
      emotional: "Nagging worry without time to verify"
      opportunity: "Missing better tools that could improve their product"
    current_solution_gaps:
      - "Leaderboards are generic, not personalized to their use case"
      - "Enterprise tools are overkill and overpriced for solopreneurs"
      - "Everything has hidden incentives (volume routing, affiliate deals, vendor relationships)"
    unique_angle:
      - "Structurally independent - no investors, no partners, can't be compromised"
      - "Proactive alerts instead of passive data dumps"
      - "Right-sized for solopreneurs, not bloated for enterprise"
    solution_opportunity: "An independent advisor that monitors continuously and tells them when something better exists for their specific use case"

  - name: "Information Overload"
    specific_problems:
      - "400+ models and growing - impossible to track manually"
      - "Constant price changes with no central notification system"
      - "Conflicting benchmarks across different sources"
      - "No single source of truth for model comparisons"
    impact:
      time: "Hours lost to manual research that could be spent building"
      decision_paralysis: "Too many options leads to sticking with 'safe' choices"
      missed_opportunities: "Better models exist but aren't on their radar"
      cognitive_load: "Mental overhead of feeling like they should be tracking this"
    current_solution_gaps:
      - "Leaderboards require you to check them manually"
      - "No aggregation of pricing, performance, and availability in one place"
      - "Data scattered across provider docs, Twitter, Discord, Reddit"
    unique_angle:
      - "We do the monitoring so they don't have to"
      - "Aggregated intelligence from multiple sources"
      - "Filtered to what matters for their specific use case"
    solution_opportunity: "Continuous monitoring and aggregation that cuts through the noise and surfaces only relevant changes"

  - name: "Trust Deficit"
    specific_problems:
      - "No transparent, independent source they can verify"
      - "Recommendations without reasoning feel like black boxes"
      - "Can't validate claims before committing to a switch"
      - "Every tool has hidden incentives (volume, affiliates, partnerships)"
    impact:
      skepticism: "Analysis paralysis and delayed decisions"
      dismissal: "Dismiss good options because they can't verify claims"
      inertia: "Stick with suboptimal choices because switching feels risky"
      wasted_time: "Cross-referencing multiple sources to triangulate truth"
    current_solution_gaps:
      - "Leaderboards don't explain methodology"
      - "Benchmarks are often gamed or vendor-influenced"
      - "No way to test recommendations with your own prompts before switching"
    unique_angle:
      - "Structurally independent - literally cannot be compromised"
      - "Show our work: data sources, reasoning, confidence levels"
      - "Sanity check feature: test before you switch"
    solution_opportunity: "An advisor that earns trust through transparency and lets you verify before you commit"

# ============================================================
# SECTION II: STRATEGIC POSITIONING
# ============================================================

strategic_positioning:
  reframe:
    old: "'Kayak for LLMs' - find the best deal"
    new: "'Consumer Reports for AI' - find what you can trust"
  core_insight: "In a future where AI is ubiquitous, knowing what to trust will be of immense value. The question isn't 'which model is cheapest' - it's 'can I trust this AI with my data, my users, my business?'"
  opportunity: "Become the Trust Authority for AI - like Underwriters Laboratories (UL) for safety, Consumer Reports for independent ratings, or Moody's for risk assessment."

# ============================================================
# SECTION II: KEYSTONE PRODUCTS (Enhanced with honest_limitations + risks)
# ============================================================

keystone_products:
  primary:
    - name: "ModelOptix Core"
      problem_solved: "No trusted third party exists for AI model evaluation. Users can't answer: 'Can I trust this AI with my data, my users, my business?'"
      target_people: "Solopreneur builders, indie developers, and startup CTOs who need to make informed AI decisions"
      core_features:
        - name: "Trust Dashboard"
          priority: "P0"
          description: "Trust Scores across verifiable dimensions, Trust Transparency Reports, Trust Requirements Matching, confidence levels"
        - name: "Trust Scoring Framework"
          priority: "P0"
          description: "Canonical 8 dimensions - 3 Model (Output Quality, Output Safety, Training Transparency) + 5 Provider (Uptime, Data Privacy, API Stability, Pricing Transparency, Support Quality)"
        - name: "Trust Transparency Reports"
          priority: "P0"
          description: "For each model: what we know, don't know, sources, last verification date, confidence level"
        - name: "Opportunities Dashboard"
          priority: "P0"
          description: "Cost and performance optimization opportunities with personalized recommendations and ROI projections"
        - name: "Savings Dashboard"
          priority: "P1"
          description: "Tracks actual savings, each model change logged with before/after, cumulative view"
        - name: "Model Comparison"
          priority: "P0"
          description: "Side-by-side on trust AND performance/cost, filter by requirements, tier-based slots"
        - name: "Trust Alerts"
          priority: "P0"
          description: "Proactive notifications for ToS changes, certifications, incidents, regulations, price changes"
        - name: "Sanity Check"
          priority: "P0"
          description: "Run your prompts through current vs recommended model, side-by-side output comparison"
      success_metrics:
        - metric: "Time to first trust insight"
          target: "< 10 minutes"
        - metric: "Users acting on recommendations"
          target: "> 30%"
        - metric: "Trial to paid conversion"
          target: "> 45%"
        - metric: "Monthly churn"
          target: "< 4%"
        - metric: "Trust reports cited/shared"
          target: "Growing"
      keystone_effect: "Establishes ModelOptix as the trust authority. Users who rely on our trust assessments won't leave because no one else provides this."
      competitive_advantage: "Structurally independent - can't be compromised. Rigorous verification, not repackaged marketing. Explicit about what we know, don't know, and can't verify."
      honest_limitations:
        - "Some claims (certifications, ToS) are verifiable; others require provider cooperation"
        - "We must be explicit: 'This is what provider claims. This is what we verified. This is unknown.'"
        - "Clear disclaimers: Trust scores are our assessment, not guarantees"
      vision_alignment: "This IS the vision - 'the unbiased guide in a world where AI serves hidden interests'"
      future_extensions:
        - name: "Cost Anomaly Detection"
          phase: "Phase 1.5"
        - name: "Prompt Optimization Engine"
          phase: "Phase 2-3"
        - name: "A/B Testing Suite"
          phase: "Phase 2"
        - name: "Budget Controls"
          phase: "Phase 2"
        - name: "Team Collaboration"
          phase: "Phase 2"

    - name: "ModelOptix Router"
      problem_solved: "Developers need intelligent routing that enforces trust requirements AND optimizes every API call automatically"
      target_people: "Power users graduating from Core, plus developers who want trust and optimization baked into infrastructure"
      core_features:
        - name: "Trust-based routing"
          priority: "P0"
          description: "Route based on trust requirements ('only use models where data isn't logged')"
        - name: "Data residency routing"
          priority: "P0"
          description: "Route based on data residency requirements ('EU processing only')"
        - name: "Auto-optimization"
          priority: "P0"
          description: "Auto-selects optimal model per request (trust + performance + cost)"
        - name: "Trusted fallbacks"
          priority: "P0"
          description: "Handles fallbacks automatically to trusted alternatives only"
        - name: "Compliance enforcement"
          priority: "P0"
          description: "Enforces compliance requirements at infrastructure level"
        - name: "Caching and budgets"
          priority: "P1"
          description: "Caches identical requests, enforces budget limits"
        - name: "Unified API"
          priority: "P0"
          description: "Your App → ModelOptix Router → Provider APIs"
      success_metrics:
        - metric: "API volume growth"
          target: "Growing MoM"
        - metric: "Trust requirements enforced"
          target: "100%"
        - metric: "Cost savings delivered"
          target: "Measurable"
        - metric: "Uptime/reliability"
          target: "> 99.9%"
      keystone_effect: "Massive stickiness - you're in the critical path. Data flywheel - real usage data improves trust AND performance assessments."
      competitive_advantage: "Trust-aware routing. Competitors optimize for speed/cost. We optimize for trust + speed + cost."
      business_model: "Usage-based revenue (0.5-2% of LLM spend)"
      risks:
        - "Competes with OpenRouter. Differentiate on trust intelligence, not just access."
      vision_alignment: "Trust enforcement at the infrastructure level - you can't accidentally use an untrusted model"

    - name: "ModelOptix Platform (The Trust Authority)"
      problem_solved: "The AI ecosystem lacks a trusted, independent authority for model evaluation and certification"
      target_people: "Developers discovering models, enterprises needing due diligence, regulators needing standards, providers wanting credibility"
      core_features:
        - name: "Trust Registry"
          priority: "P0"
          description: "Comprehensive trust profiles for every major model"
        - name: "Model Marketplace"
          priority: "P0"
          description: "Curated directory with trust ratings, reviews, verified benchmarks"
        - name: "Provider Dashboard"
          priority: "P1"
          description: "Providers see their trust scores and how to improve"
        - name: "Certification Program"
          priority: "P1"
          description: "'ModelOptix Certified' badge for providers meeting trust standards"
        - name: "Integration Ecosystem"
          priority: "P2"
          description: "Plugins for LangChain, LlamaIndex, Vercel AI SDK"
        - name: "Open-Source Tooling"
          priority: "P2"
          description: "CLI tools, SDKs, eval frameworks (freemium funnel)"
        - name: "Regulatory Intelligence"
          priority: "P2"
          description: "EU AI Act compliance tracking, GDPR guidance"
      success_metrics:
        - metric: "Trust Registry coverage"
          target: "> 90% of major models"
        - metric: "Citations in enterprise procurement"
          target: "Regular mentions"
        - metric: "Regulatory recognition"
          target: "EU AI Act reference"
        - metric: "Provider certification adoption"
          target: "Growing"
      keystone_effect: "Becomes the standard for AI trust assessment. SEO + discovery moat. Network effects."
      competitive_advantage: "The only independent trust authority. We don't take provider money for recommendations."
      business_model: "User subscriptions, enterprise contracts, consulting/audits. NO sponsored recommendations."
      vision_alignment: "'The unbiased guide' at ecosystem scale"

  secondary:
    - name: "Trust Consulting/Audit"
      description: "We'll assess your AI stack for trust and compliance risks"
      builds_on: "Trust assessment expertise from Core product"
      business_model: "Project-based ($5-50K)"
      target: "Enterprises and funded startups with regulatory obligations"

    - name: "Benchmark-as-a-Service"
      description: "Custom eval suites including trust dimensions"
      builds_on: "Testing infrastructure from Core product"
      business_model: "Enterprise contracts"
      target: "Companies needing rigorous model evaluation for compliance"

    - name: "Training/Courses"
      description: "AI Trust & Compliance Masterclass"
      builds_on: "Knowledge and authority from running ModelOptix"
      business_model: "Course sales ($200-500)"
      target: "Developers, CTOs, and compliance officers"

# ============================================================
# SECTION III: DEVELOPMENT PHASES
# ============================================================

development_phases:
  phase_philosophy: "The value ladder is driven by volume, not features. Users upgrade because they hit volume limits. If the core isn't compelling enough to drive volume, no amount of tier-gated features will save us."

  phases:
    - phase_id: "phase_0"
      name: "Pre-Launch Validation"
      timeline: "Complete by January 12, 2026"
      objective: "Get the landing page live and start building presence. Begin demand validation."
      focus: "Ship fast, iterate based on feedback"
      products: "Landing page, waitlist, build in public presence"
      milestones:
        product:
          - milestone: "Landing page live"
            target: "Jan 12"
            significance: "Can articulate value prop clearly"
          - milestone: "Build in public presence started"
            target: "Jan 12"
            significance: "WIP.co, X/Twitter active"
          - milestone: "Email capture working"
            target: "Jan 12"
            significance: "Can collect waitlist signups"
        strategic:
          - milestone: "First 100 waitlist signups"
            target: "Week 2-3"
            significance: "Initial interest exists"
          - milestone: "First 10 user interviews"
            target: "Week 3-4"
            significance: "Understand real pain points"
          - milestone: "500 waitlist signups"
            target: "Week 4-5"
            significance: "Growing momentum"
          - milestone: "1,000+ waitlist signups"
            target: "Week 6-8"
            significance: "Demand validated"
      success_criteria:
        - "Messaging resonance: Landing page conversion > 20%"
        - "Quality over quantity: 100+ signups who reply to emails / engage"
        - "Payment intent: At least 50 people commit to pre-order"
        - "User interviews: 10+ conversations, clear patterns"
        - "Positioning validated: Users explain what ModelOptix does in their own words"

    - phase_id: "phase_1"
      name: "Foundation"
      timeline: "Year 1"
      objective: "Build a core product so valuable that users want MORE of it."
      focus: "Prove the value prop works - people actually save money, actually trust recommendations, and naturally want to monitor more products."
      products:
        - "ModelOptix Core MVP"
        - "Trust Dashboard"
        - "Opportunities Dashboard"
        - "Model Comparison"
        - "Sanity Check"
        - "Alerts"
      strategic_objectives:
        - "Validate demand: 100+ signups in first 30 days"
        - "Validate clarity: Users understand what we do"
        - "Validate word-of-mouth: Organic referrals without incentives"
        - "Prove independence positioning resonates"
        - "First 100 paying customers"
      go_to_market:
        - "Build in public (WIP.co daily, X/Twitter ongoing)"
        - "Waitlist → Alpha testers → Public launch"
        - "Launch on Indie Hackers, Hacker News, Product Hunt"
        - "Document own savings on personal projects"
      milestones:
        product:
          - milestone: "Alpha launch"
            target: "Month 2-3"
            significance: "First real users, high-touch feedback"
          - milestone: "Public MVP launch"
            target: "Month 4-5"
            significance: "HN, Product Hunt, Indie Hackers"
          - milestone: "100 paying customers"
            target: "Month 6"
            significance: "Revenue validation"
          - milestone: "1,000 paying customers"
            target: "Month 9"
            significance: "Growth trajectory proven"
        strategic:
          - milestone: "First organic referral"
            target: "Month 3"
            significance: "Word-of-mouth working"
          - milestone: "Independence positioning cited"
            target: "Month 4+"
            significance: "Differentiation resonating"
          - milestone: "Trial-to-paid > 45%"
            target: "Month 6+"
            significance: "Conversion validated"
          - milestone: "NPS > 50"
            target: "Month 6+"
            significance: "Product-market fit signal"
        revenue:
          - milestone: "First $1K MRR"
            target: "Month 4-5"
            notes: "~100 Solo users"
          - milestone: "$5K MRR"
            target: "Month 7-8"
            notes: "~350 users across tiers"
          - milestone: "$10K MRR"
            target: "Month 10-12"
            notes: "~700 users"
          - milestone: "$20K MRR"
            target: "Month 12+"
            notes: "Year 1 target ($240K ARR)"
      success_criteria:
        - "Time to first insight < 10 minutes"
        - "Trial to paid conversion > 45%"
        - "Users acting on recommendations > 30%"
        - "NPS > 50"
        - "Weekly payback achieved for most users"
        - "Users adding 2nd and 3rd products"
      revenue_target: "$140K-280K Year 1 (1,250-2,500 paid users)"

    - phase_id: "phase_2"
      name: "Expansion"
      timeline: "Years 2-3"
      objective: "Make the core so sticky that users naturally hit Solo limits and upgrade to Growth/Pro."
      focus: "Deepen the value of every interaction. More reasons to check, more reasons to test, more reasons to add products."
      products:
        - "Enhanced Core (Savings Dashboard, Cost Anomaly Detection, Trust Alerts, Migration Guides)"
        - "ModelOptix Router"
      strategic_objectives:
        - "Solo → Growth upgrades driven by 3-product limit"
        - "Growth → Pro upgrades driven by heavy testing usage"
        - "Establish 'Growth' as hero tier (60% of paying customers)"
        - "Router creates usage-based revenue stream"
        - "Net Revenue Retention > 110%"
      milestones:
        product:
          - milestone: "Savings Dashboard shipped"
            target: "Year 2 Q1"
            significance: "Cumulative value visible"
          - milestone: "Trust Alerts shipped"
            target: "Year 2 Q1"
            significance: "Engagement driver live"
          - milestone: "Router beta"
            target: "Year 2 Q2-3"
            significance: "Usage-based revenue stream"
          - milestone: "Router GA"
            target: "Year 2 Q4"
            significance: "Second product validated"
        strategic:
          - milestone: "Growth = 60% of paid users"
            target: "Year 2"
            significance: "Hero tier established"
          - milestone: "Solo → Growth upgrade > 12%"
            target: "Year 2"
            significance: "Volume-driven upgrades working"
          - milestone: "Net Revenue Retention > 110%"
            target: "Year 2+"
            significance: "Expansion revenue healthy"
          - milestone: "First enterprise customer"
            target: "Year 2-3"
            significance: "Upmarket expansion starting"
        revenue:
          - milestone: "$50K MRR"
            target: "Year 2"
            notes: "~3,500 users"
          - milestone: "$100K MRR"
            target: "Year 2-3"
            notes: "~7,000 users or fewer with upgrades"
          - milestone: "$1M ARR"
            target: "Year 2-3"
            notes: "Milestone for sustainable business"
      success_criteria:
        - "Solo → Growth upgrade rate > 12% within 90 days"
        - "Growth → Pro upgrade rate > 10% within 90 days"
        - "Average products per user increasing QoQ"
        - "Monthly churn < 4%"
        - "Router achieving product-market fit"

    - phase_id: "phase_3"
      name: "Dominance"
      timeline: "Years 4-7"
      objective: "Become the Trust Authority for AI - the institution everyone relies on."
      focus: "Platform economics. Network effects. The definitive source for AI trust and optimization."
      products:
        - "ModelOptix Platform (Marketplace, Provider Dashboard, Trust Registry)"
        - "Certification Program ('ModelOptix Certified' badge)"
        - "Integration Ecosystem (LangChain, LlamaIndex, Vercel AI SDK)"
        - "Open-Source Tooling (CLI, SDKs, eval frameworks)"
      strategic_objectives:
        - "Own the 'Independent AI Intelligence' category"
        - "Become cited source in enterprise procurement"
        - "Regulatory recognition (EU AI Act compliance reference)"
        - "Provider adoption of certification program"
        - "Platform revenue streams (B2B, enterprise)"
      milestones:
        product:
          - milestone: "Platform/Marketplace live"
            target: "Year 4"
            significance: "Network effects begin"
          - milestone: "Trust Registry comprehensive"
            target: "Year 4-5"
            significance: ">90% of major models covered"
          - milestone: "Certification program launched"
            target: "Year 5"
            significance: "Provider revenue stream"
          - milestone: "Integration ecosystem"
            target: "Year 5-6"
            significance: "LangChain, LlamaIndex, Vercel plugins"
        strategic:
          - milestone: "Cited in enterprise procurement"
            target: "Year 4+"
            significance: "Trust authority recognized"
          - milestone: "Regulatory recognition"
            target: "Year 5+"
            significance: "EU AI Act compliance reference"
          - milestone: "'ModelOptix Certified' in provider marketing"
            target: "Year 5+"
            significance: "Certification has market value"
          - milestone: "Category 'Independent AI Intelligence' owned"
            target: "Year 6-7"
            significance: "Default destination for AI evaluation"
        revenue:
          - milestone: "$5M ARR"
            target: "Year 4-5"
            notes: "Sustainable, growing business"
          - milestone: "Platform revenue 20% of total"
            target: "Year 5+"
            notes: "Diversified revenue streams"
          - milestone: "$10M+ ARR"
            target: "Year 6-7"
            notes: "Category leader economics"
      success_criteria:
        - "Trust Registry coverage > 90% of major models"
        - "Citations in enterprise RFPs and procurement"
        - "Provider dashboard adoption"
        - "Platform traffic and engagement growing"
        - "Category leadership established"

# ============================================================
# SECTION IV: PRODUCT INTERDEPENDENCIES (Enhanced with capability_building)
# ============================================================

product_interdependencies:
  enablement_chain:
    - "Core MVP enables everything - validates demand and creates foundation"
    - "Savings Dashboard + Trust Alerts (needs usage history and trust data from Core)"
    - "Router (needs recommendation engine, trust scoring, and proven value prop from Core)"
    - "Platform (needs trust data, user base, and credibility from Core + Router)"

  required_sequence:
    - priority: 1
      product: "Core MVP"
      why: "Validates everything, creates foundation"
    - priority: 2
      product: "Savings Dashboard"
      why: "Proves cumulative value, drives volume"
    - priority: 3
      product: "Trust Alerts"
      why: "Creates urgency, drives engagement"
    - priority: 4
      product: "Router"
      why: "Usage revenue, data flywheel"
    - priority: 5
      product: "Platform"
      why: "Network effects, category ownership"

  can_build_in_parallel:
    - "Savings Dashboard and Trust Alerts (both extend Core, no dependency on each other)"
    - "Open-source tooling (can start early for developer goodwill)"
    - "Content/SEO (should run continuously from day 1)"

  capability_building:
    phase_1:
      - "Trust scoring methodology"
      - "Recommendation engine"
      - "Model database and monitoring"
      - "User onboarding and activation"
    phase_2:
      - "Historical tracking and analytics"
      - "Alert infrastructure"
      - "API/routing infrastructure"
      - "Usage-based billing"
    phase_3:
      - "Marketplace infrastructure"
      - "Provider relationship management"
      - "Certification program"
      - "Integration ecosystem"

# ============================================================
# SECTION VI: SUCCESS METRICS (Enhanced with trust_specific + pricing_page)
# ============================================================

success_metrics:
  conversion:
    - metric: "Trial → Paid"
      target: "> 45%"
      alert_if: "< 35%"
    - metric: "Free (downgrade) → Paid"
      target: "> 15%"
      alert_if: "< 10%"
    - metric: "Annual vs Monthly mix"
      target: "> 70% annual"
      alert_if: "< 50% annual"
    - metric: "Landing page → Signup"
      target: "> 20%"
      alert_if: "< 10%"

  activation:
    - metric: "Time to first product added"
      target: "< 1 hour"
      alert_if: "> 24 hours"
    - metric: "First savings/insight shown"
      target: "< 1 hour"
      alert_if: "> 4 hours"
    - metric: "Sanity check used in trial"
      target: "> 60% of trials"
      alert_if: "< 40%"
    - metric: "Day 6-7 login rate"
      target: "> 50%"
      alert_if: "< 30%"

  upgrades:
    - metric: "Solo → Growth (90 days)"
      target: "> 12%"
      alert_if: "< 8%"
    - metric: "Growth → Pro (90 days)"
      target: "> 10%"
      alert_if: "< 5%"
    - metric: "Expansion revenue % of MRR"
      target: "> 20%"
      alert_if: "< 10%"
    - metric: "Net Revenue Retention"
      target: "> 110%"
      alert_if: "< 100%"
    - metric: "Average products per user"
      target: "Growing QoQ"
      alert_if: "Flat or declining"

  retention:
    - metric: "Monthly churn"
      target: "< 4%"
      alert_if: "> 6%"
    - metric: "Week 1 payback achieved"
      target: "> 80% of users"
      alert_if: "< 60%"
    - metric: "NPS score"
      target: "> 50"
      alert_if: "< 30"
    - metric: "90-day retention"
      target: "> 85%"
      alert_if: "< 70%"

  acquisition:
    - metric: "Referral rate"
      target: "> 10%"
      alert_if: "< 5%"
    - metric: "'Heard from referral'"
      target: "> 30%"
      alert_if: "< 15%"
    - metric: "LTV:CAC"
      target: "> 10:1"
      alert_if: "< 5:1"
    - metric: "ARPU"
      target: "> $15/mo"
      alert_if: "< $10/mo"

  trust_specific:
    - metric: "Trust reports viewed"
      target: "Growing MoM"
      alert_if: "Declining"
    - metric: "Trust alerts acted on"
      target: "> 25%"
      alert_if: "< 10%"
    - metric: "'Independence' cited in feedback"
      target: "Regular mentions"
      alert_if: "Never mentioned"
