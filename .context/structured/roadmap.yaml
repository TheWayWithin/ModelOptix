# ============================================================
# SECTION IX: RISKS (Enhanced with risk_monitoring)
# ============================================================

risks:
  - name: "Adoption (Cold Start)"
    severity: "High"
    probability: "Medium (mitigated by build in public strategy)"
    description: "Can't get initial traction, no one signs up"
    impact: "Business doesn't launch, time and effort wasted"
    mitigations:
      - "Solve your own problem publicly - 'I saved $X on my own products' = ultimate credibility"
      - "Build in public - daily progress builds audience before launch"
      - "Alpha testers from waitlist - validates demand, creates testimonials"
      - "Launch in friendly communities - Indie Hackers, WIP already root for you"
    key_insight: "You ARE your target customer."

  - name: "Competition (OpenRouter adds recommendations)"
    severity: "Medium"
    probability: "Medium-High (they have $40M and this is obvious)"
    description: "OpenRouter (or similar) adds recommendation layer with more users and data"
    impact: "Harder to differentiate, may lose market window"
    mitigations:
      - "Structural independence - they have investors, volume incentives. You don't. They literally cannot copy your structure."
      - "Speed to trust - establish 'independent referee' brand before they move"
      - "Depth for solopreneurs - they'll build generic; you build personalized with switching costs"
      - "Trust-first positioning - they optimize for routing; you optimize for trust"
    key_insight: "They can copy features. They CANNOT copy your structure."

  - name: "Market Timing"
    severity: "Medium"
    probability: "Medium"
    description: "Major players bundle 'good enough' model selection. Window estimated at 6-18 months."
    impact: "Harder to establish category, may become feature of bigger platform"
    mitigations:
      - "Create category - 'Independent AI Intelligence' - category creators capture 76% of market cap"
      - "Trust over features - features get copied quickly; trust doesn't"
      - "Lock in early advocates - they become your distribution moat"
      - "Move fast with users - ship to learn, not to launch"

  - name: "Trust Verification Limitations"
    severity: "Medium"
    probability: "Medium"
    description: "Can't actually verify all trust claims - some require provider cooperation"
    impact: "Trust scores seen as unreliable, differentiation weakened"
    mitigations:
      - "Radical transparency - explicit about what we know, don't know, and can't verify"
      - "Clear confidence levels - high/medium/low/unknown for each dimension"
      - "Source everything - show where every claim comes from"
      - "No false certainty - 'unknown' is better than wrong"

  - name: "Solopreneur Burnout"
    severity: "Medium"
    probability: "Medium (common in bootstrapped businesses)"
    description: "Trying to do everything alone leads to exhaustion, quality drops"
    impact: "Product suffers, growth stalls, health issues"
    mitigations:
      - "AI-assisted development - Claude Code multiplies your capacity"
      - "Clear phase priorities - don't try to build everything at once"
      - "Revenue-first milestones - hire help when you can afford it"
      - "Sustainable pace - this is a 7-year roadmap, not a sprint"

risk_monitoring:
  early_warning_indicators:
    - indicator: "Waitlist growth stalling"
      signals: "Messaging or channel problem"
    - indicator: "Trial completion dropping"
      signals: "Onboarding friction"
    - indicator: "Churn increasing"
      signals: "Value delivery problem"
    - indicator: "Support tickets spiking"
      signals: "Product quality issues"
    - indicator: "Competitor announcements"
      signals: "Market positioning threat"
    - indicator: "Burnout symptoms"
      signals: "Need to slow down or get help"

  response_framework:
    - step: "Detect"
      description: "Monitor early warning indicators weekly"
    - step: "Assess"
      description: "Is this a blip or a trend?"
    - step: "Diagnose"
      description: "Root cause analysis (talk to users, look at data)"
    - step: "Respond"
      description: "Implement mitigation"
    - step: "Review"
      description: "Did it work? Adjust if needed."

