product_interdependencies:
  enablement_chain:
    - "Core MVP → validates everything"
    - "Savings Dashboard + Trust Alerts → drives volume"
    - "Router → usage-based revenue, data flywheel"
    - "Platform → network effects, category ownership"
  required_sequence:
    - priority: 1
      product: "Core MVP"
      why: "Validates everything, creates foundation"
    - priority: 2
      product: "Savings Dashboard"
      why: "Proves cumulative value, drives volume"
    - priority: 3
      product: "Trust Alerts"
      why: "Creates urgency, drives engagement"
    - priority: 4
      product: "Router"
      why: "Usage revenue, data flywheel"
    - priority: 5
      product: "Platform"
      why: "Network effects, category ownership"
  can_build_in_parallel:
    - "Savings Dashboard and Trust Alerts"
    - "Open-source tooling (can start early for developer goodwill)"
    - "Content/SEO (should run continuously from day 1)"

