metadata:
  version: "1.0"
  date: "January 7, 2026"
  purpose: "Strategic roadmap from Vision to Great through keystone product development"

strategic_foundation:
  vision: "To be the unbiased guide in a world where AI serves hidden interests."
  mission: "Through radical transparency and independent analysis, we help developers optimize their AI stack today - building the foundation for AI truth everyone can trust tomorrow."
  hedgehog_concept: "We are solopreneurs building truly independent AI intelligence for solopreneurs - growing by delivering so much value to indie hackers that they can't help but spread the word."

problem_categories:
  - name: "Portfolio Drift"
    specific_problems:
      - "Research decay - picked a model months ago, haven't re-evaluated since"
      - "Overpaying by 20-40% without realizing it"
      - "Decisions based on stale information (3-6 months old)"
      - "Background anxiety - 'am I doing this right?' without time to check"
    impact:
      financial: "Quietly bleeding money every month on suboptimal choices"
      competitive: "Falling behind competitors who optimize their AI stack"
      emotional: "Nagging worry without time to verify"
      opportunity: "Missing better tools that could improve their product"
    solution_opportunity: "An independent advisor that monitors continuously and tells them when something better exists for their specific use case"
  - name: "Information Overload"
    specific_problems:
      - "400+ models and growing - impossible to track manually"
      - "Constant price changes with no central notification system"
      - "Conflicting benchmarks across different sources"
      - "No single source of truth for model comparisons"
    impact:
      time: "Hours lost to manual research that could be spent building"
      decision: "Decision paralysis - too many options leads to sticking with 'safe' choices"
      opportunity: "Better models exist but aren't on their radar"
      cognitive: "Mental overhead of feeling like they should be tracking this"
    solution_opportunity: "Continuous monitoring and aggregation that cuts through the noise and surfaces only relevant changes"
  - name: "Trust Deficit"
    specific_problems:
      - "No transparent, independent source they can verify"
      - "Recommendations without reasoning feel like black boxes"
      - "Can't validate claims before committing to a switch"
      - "Every tool has hidden incentives (volume, affiliates, partnerships)"
    impact:
      skepticism: "Analysis paralysis and delayed decisions"
      dismissal: "Dismiss good options because they can't verify claims"
      inertia: "Stick with suboptimal choices because switching feels risky"
      time_waste: "Cross-referencing multiple sources to triangulate truth"
    solution_opportunity: "An advisor that earns trust through transparency and lets you verify before you commit"

strategic_positioning:
  reframe:
    old: "Kayak for LLMs - find the best deal"
    new: "Consumer Reports for AI - find what you can trust"
  core_insight: "In a future where AI is ubiquitous, knowing what to trust will be of immense value. The question isn't 'which model is cheapest' - it's 'can I trust this AI with my data, my users, my business?'"
  opportunity: "Become the Trust Authority for AI - like Underwriters Laboratories (UL) for safety, Consumer Reports for independent ratings, or Moody's for risk assessment."

keystone_products:
  primary:
    - name: "ModelOptix Core"
      problem_solved: "No trusted third party exists for AI model evaluation. Users can't answer: 'Can I trust this AI with my data, my users, my business?'"
      target_people: "Solopreneur builders, indie developers, and startup CTOs who need to make informed AI decisions"
      core_features:
        - name: "Trust Dashboard"
          priority: "Primary Value"
          description: "Trust Scores across verifiable dimensions, Trust Transparency Reports for each model, Trust Requirements Matching"
        - name: "Trust Scoring Framework"
          description: "Canonical 8 dimensions (3 Model + 5 Provider)"
          model_dimensions:
            - name: "Output Quality"
              tracks: "Accuracy, consistency, benchmark performance"
              verification: "Artificial Analysis, Arena ELO, MMLU"
            - name: "Output Safety"
              tracks: "Guardrails, refusal rates, jailbreak resistance"
              verification: "Safety benchmarks, incident reports, our own testing"
            - name: "Training Transparency"
              tracks: "Openness about data, methods, limitations"
              verification: "Provider documentation, model cards"
          provider_dimensions:
            - name: "Uptime"
              tracks: "Service availability, reliability"
              verification: "Status pages, own monitoring"
            - name: "Data Privacy"
              tracks: "Logging policy, retention, training on inputs"
              verification: "ToS analysis, privacy policies"
            - name: "API Stability"
              tracks: "Error rates, deprecation history, breaking changes"
              verification: "Own metrics, changelog analysis"
            - name: "Pricing Transparency"
              tracks: "Clear pricing, no hidden fees, advance notice"
              verification: "Pricing pages, historical tracking"
            - name: "Support Quality"
              tracks: "Response times, documentation quality"
              verification: "Community sentiment, own experience"
        - name: "Trust Transparency Reports"
          description: "For each model: exactly what we know and don't know, sources for every claim, date of last verification, confidence level"
        - name: "Opportunities Dashboard"
          priority: "Secondary Value"
          description: "Cost and performance optimization opportunities, recommendations personalized to use case, clear ROI projections"
        - name: "Savings Dashboard"
          description: "Tracks actual savings since using ModelOptix, each model change logged with before/after, cumulative view"
        - name: "Model Comparison"
          description: "Side-by-side comparison on trust AND performance/cost, filter by trust requirements, use case, price, provider"
        - name: "Trust Alerts"
          description: "Proactive notifications for ToS changes, certifications, incidents, price changes, new models"
        - name: "Sanity Check"
          description: "Run your prompts through current vs recommended model, side-by-side output comparison, confidence validation"
      success_metrics:
        - metric: "Time to first trust insight"
          target: "< 10 minutes"
        - metric: "Users acting on recommendations"
          target: "> 30%"
        - metric: "Trial to paid conversion"
          target: "> 45%"
        - metric: "Monthly churn"
          target: "< 4%"
      keystone_effect: "Establishes ModelOptix as the trust authority. Users who rely on our trust assessments won't leave because no one else provides this."
      future_extensions:
        - name: "Cost Anomaly Detection"
          phase: "1.5"
        - name: "Prompt Optimization Engine"
          phase: "2-3"
        - name: "A/B Testing Suite"
          phase: "2"
        - name: "Budget Controls"
          phase: "2"
        - name: "Team Collaboration"
          phase: "2"
    - name: "ModelOptix Router"
      problem_solved: "Developers need intelligent routing that enforces trust requirements AND optimizes every API call automatically"
      target_people: "Power users graduating from Core, plus developers who want trust and optimization baked into infrastructure"
      core_capabilities:
        - "Route based on trust requirements ('only use models where data isn't logged')"
        - "Route based on data residency requirements ('EU processing only')"
        - "Auto-selects optimal model per request (trust + performance + cost)"
        - "Handles fallbacks automatically (to trusted alternatives only)"
        - "Enforces compliance requirements at the infrastructure level"
        - "Caches identical requests, enforces budget limits"
        - "Logs everything for continuous optimization"
        - "Unified API (Your App → ModelOptix Router → Provider APIs)"
      business_model: "Usage-based revenue (0.5-2% of LLM spend)"
      keystone_effect: "Massive stickiness - you're in the critical path. Data flywheel - real usage data improves trust AND performance assessments."
      competitive_advantage: "Trust-aware routing. Competitors optimize for speed/cost. We optimize for trust + speed + cost."
    - name: "ModelOptix Platform (The Trust Authority)"
      problem_solved: "The AI ecosystem lacks a trusted, independent authority for model evaluation and certification"
      target_people: "Developers discovering models, enterprises needing due diligence, regulators needing standards, providers wanting credibility"
      core_capabilities:
        - name: "Trust Registry"
          description: "Comprehensive trust profiles for every major model"
        - name: "Model Marketplace"
          description: "Curated directory with trust ratings, reviews, verified benchmarks"
        - name: "Provider Dashboard"
          description: "Providers see their trust scores and how to improve"
        - name: "Certification Program"
          description: "'ModelOptix Certified' badge for providers meeting trust standards"
        - name: "Integration Ecosystem"
          description: "Plugins for LangChain, LlamaIndex, Vercel AI SDK"
        - name: "Open-Source Tooling"
          description: "CLI tools, SDKs, eval frameworks (freemium funnel)"
        - name: "Regulatory Intelligence"
          description: "EU AI Act compliance tracking, GDPR guidance"
      keystone_effect: "Becomes the standard for AI trust assessment. SEO + discovery moat from being the definitive source. Network effects."
  secondary:
    - name: "Trust Consulting/Audit"
      description: "Assess your AI stack for trust and compliance risks"
      business_model: "Project-based ($5-50K)"
      target: "Enterprises and funded startups with regulatory obligations"
    - name: "Benchmark-as-a-Service"
      description: "Custom eval suites including trust dimensions"
      business_model: "Enterprise contracts"
      target: "Companies needing rigorous model evaluation for compliance"
    - name: "Training/Courses"
      description: "AI Trust & Compliance Masterclass - how to evaluate and select trustworthy AI"
      business_model: "Course sales ($200-500)"
      target: "Developers, CTOs, and compliance officers"

development_phases:
  phase_philosophy: "Volume Drives Upgrades - users upgrade because they hit volume limits, not for features"
  phase_0:
    name: "Pre-Launch Validation"
    timeline: "Complete by January 12, 2026"
    objective: "Get the landing page live and start building presence. Begin demand validation."
    milestones:
      - milestone: "Landing page live"
        status: "Required"
        proves: "Can articulate value prop clearly"
      - milestone: "Build in public presence started"
        status: "Required"
        proves: "WIP.co, X/Twitter active"
      - milestone: "Email capture working"
        status: "Required"
        proves: "Can collect waitlist signups"
      - milestone: "First post announcing ModelOptix"
        status: "Required"
        proves: "Public commitment made"
    ongoing_validation:
      - milestone: "First 100 waitlist signups"
        target: "Week 2-3"
      - milestone: "First 10 user interviews"
        target: "Week 3-4"
      - milestone: "500 waitlist signups"
        target: "Week 4-5"
      - milestone: "Payment intent signals"
        target: "Week 4-6"
      - milestone: "1,000+ waitlist signups"
        target: "Week 6-8"
      - milestone: "Alpha testers recruited"
        target: "Week 6-8"
    success_criteria:
      - "Messaging resonance: Landing page conversion > 20% (visitor → signup)"
      - "Quality over quantity: 100+ signups who reply to emails / engage"
      - "Payment intent: At least 50 people commit to pre-order or payment hold"
      - "User interviews: 10+ conversations, clear patterns in pain points"
      - "Positioning validated: Users can explain what ModelOptix does in their own words"
  phase_1:
    name: "Foundation"
    timeline: "Year 1"
    objective: "Build a core product so valuable that users want MORE of it."
    focus: "Prove the value prop works - people actually save money, actually trust recommendations, and naturally want to monitor more products."
    products: "ModelOptix Core MVP - Trust Dashboard, Opportunities Dashboard, Model Comparison, Sanity Check, Alerts"
    strategic_objectives:
      - "Validate demand: 100+ signups in first 30 days"
      - "Validate clarity: Users understand what we do and why it's valuable"
      - "Validate word-of-mouth: Organic referrals without incentives"
      - "Prove independence positioning resonates"
      - "First 100 paying customers"
    go_to_market:
      - "Build in public (WIP.co daily, X/Twitter ongoing)"
      - "Waitlist → Alpha testers → Public launch"
      - "Launch on Indie Hackers, Hacker News, Product Hunt"
      - "Document own savings on personal projects (ultimate credibility)"
    milestones:
      product:
        - milestone: "Alpha launch"
          target: "Month 2-3"
        - milestone: "Public MVP launch"
          target: "Month 4-5"
        - milestone: "100 paying customers"
          target: "Month 6"
        - milestone: "1,000 paying customers"
          target: "Month 9"
        - milestone: "Week-1 payback confirmed"
          target: "Month 6+"
      strategic:
        - milestone: "First organic referral"
          target: "Month 3"
        - milestone: "Independence positioning cited"
          target: "Month 4+"
        - milestone: "First user testimonial/case study"
          target: "Month 5"
        - milestone: "Trial-to-paid > 45%"
          target: "Month 6+"
        - milestone: "NPS > 50"
          target: "Month 6+"
      revenue:
        - milestone: "First $1K MRR"
          target: "Month 4-5"
          notes: "~100 Solo users"
        - milestone: "$5K MRR"
          target: "Month 7-8"
          notes: "~350 users across tiers"
        - milestone: "$10K MRR"
          target: "Month 10-12"
          notes: "~700 users, Growth tier growing"
        - milestone: "$20K MRR"
          target: "Month 12+"
          notes: "Year 1 target ($240K ARR)"
    revenue_target: "$140K-280K Year 1 (1,250-2,500 paid users)"
  phase_2:
    name: "Expansion"
    timeline: "Years 2-3"
    objective: "Make the core so sticky that users naturally hit Solo limits and upgrade to Growth/Pro."
    focus: "Deepen the value of every interaction. More reasons to check, more reasons to test, more reasons to add products."
    products:
      enhanced_core:
        - name: "Savings Dashboard"
          description: "Cumulative value proof - the longer you use it, the bigger this number"
        - name: "Cost Anomaly Detection"
          description: "More alerts to act on"
        - name: "Trust Alerts"
          description: "ToS changes, certifications, incidents"
        - name: "Migration Guides"
          description: "Easier to act on recommendations"
      new: "ModelOptix Router - For power users who want optimization baked into infrastructure"
    strategic_objectives:
      - "Solo → Growth upgrades driven by users hitting 3-product limit"
      - "Growth → Pro upgrades driven by heavy testing usage"
      - "Establish 'Growth' as the hero tier (60% of paying customers)"
      - "Router product creates usage-based revenue stream"
      - "Net Revenue Retention > 110%"
    milestones:
      product:
        - milestone: "Savings Dashboard shipped"
          target: "Year 2 Q1"
        - milestone: "Trust Alerts shipped"
