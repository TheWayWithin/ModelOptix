    description: "I only build tools that are 10x better AND 10x cheaper than alternatives. If I can't hit both, I don't build it."
  - name: "Week One Payback"
    description: "Annual subscription cost recovered in your first week. After that, it's pure profit."
  - name: "Exponential Returns"
    description: "Savings compound—not linear. More products, more optimizations, growing margins. Many users see 1000x return in year one."
  - name: "Lean = Your Gain"
    description: "No office, no staff, no investors. AI-first automation. My low overhead becomes your 10x value."
  - name: "Independence, No Hidden Fees"
    description: "Subscriptions only. No volume incentives, no referral fees, no provider kickbacks."
  - name: "Prove Value Before Trust"
    description: "7-day trial available as fallback. Money-back guarantee on all plans. Experience it first, decide second."

