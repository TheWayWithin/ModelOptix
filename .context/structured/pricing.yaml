objection_handling:
  too_expensive:
    - audience: "Solo users"
      response: "At $75/hour, 2 hours of research costs more than a year of Solo."
    - audience: "Growth/Pro users"
      response: "One delayed model switch costs $1000s/year in overspend. I catch that in week one, not month six."
    - audience: "Competitive builders"
      response: "Your competitors are optimizing. If you're running 6-month-old model choices while they're on this week's best option—that's not a cost problem, it's a survival problem."

  can_do_myself:
    response: "You can—but should you? Every hour researching models is an hour not building your product. I do the grunt work so you decide faster."

  not_sure_need_ongoing:
    response: "New models launch monthly, pricing changes weekly. What was best 6 months ago often isn't now. This is protection against the landscape changing under you."

  recommendations_wrong:
    response: "Every recommendation shows its reasoning. Plus sanity-check testing lets you validate with your actual prompts before switching. You're never flying blind."

  wait_until_need:
    response: "Developers usually wait until mid-project, under deadline, then realize they picked wrong. The trial is free—have answers ready before you need them urgently."

  current_setup_fine:
    response: "Working fine today isn't the same as winning tomorrow. In AI, standing still means falling behind. The question isn't whether your stack works—it's whether it's the best it could be while your competitors are optimizing theirs."

