executive_summary:
  market_framing:
    entry_point: "LLM Cost Optimization and Model Selection"
    evolution: "AI Portfolio Intelligence"
    launch_positioning: "Save money and find the right model (concrete, provable)"
    evolution_positioning: "Manage your AI portfolio continuously (deeper relationship, higher retention)"
  core_problem: "Developers are overpaying for AI because they can't track 400+ models and constant price changes."
  deeper_issue: "Portfolio drift — developers do research once, pick a model, ship it... and 6 months later they're overpaying and underperforming but can't justify stopping to re-evaluate."
  research_purpose: "Practical tool for building the right product — focused on actionable insights for a bootstrapped solopreneur, not external stakeholders."

