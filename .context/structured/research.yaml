  key_differentiators:
    - name: "Independence"
      description: "Structural, not just messaging (no investors, no partners)"
    - name: "Proactive"
      description: "Alerts and recommendations, not just data"
    - name: "Sanity check"
      description: "Proof, not promises (test before switching)"
    - name: "Right-sized"
      description: "Built for solopreneurs, not enterprises"

  competitors:
    - name: "Artificial Analysis"
      what_they_do: "Free benchmarks"
      their_gap: "Generic, static, no advice"
      our_advantage: "Personalized, proactive, recommends"
    - name: "OpenRouter"
      what_they_do: "API gateway ($40M raised, $500M valuation)"
      their_gap: "Volume-incentivized, no guidance"
      our_advantage: "Independent, user-aligned"
    - name: "LangSmith"
      what_they_do: "App debugging ($39/user/mo+)"
      their_gap: "Reactive, complex, expensive"
      our_advantage: "Upstream (model choice), simple"
    - name: "Helicone"
      what_they_do: "Observability (free tier)"
      their_gap: "Shows costs, doesn't optimize"
      our_advantage: "Recommends savings"
    - name: "Braintrust"
      what_they_do: "Evals/testing"
      their_gap: "Tests outputs, not model choice"
      our_advantage: "Picks the model first"
    - name: "Portkey"
      what_they_do: "Enterprise gateway ($49/mo+)"
      their_gap: "Overkill for indies"
      our_advantage: "Right-sized, affordable"

  biggest_threat:
    competitor: "OpenRouter"
