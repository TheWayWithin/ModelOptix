    - stage: "Consider"
      insight: "Time to value → Price → Credibility (decide fast)"
    - stage: "Decide"
      insight: "7-day trial, credit card upfront, auto-converts"
    - stage: "Use"
      insight: "Proactive alerts (value) + Annualized savings dashboard (proof)"
    - stage: "Advocate"
      insight: "Organic enthusiasm + Shareable savings built into UX"

  indie_developer:
    - stage: "Aware"
      difference: "HN/Reddit, not X/Twitter"
    - stage: "Consider"
      difference: "Methodology first, more skeptical"
    - stage: "Decide"
      difference: "Wants to test it; API access later (MVP+2/3)"
    - stage: "Use"
      difference: "Same + methodology transparency"
    - stage: "Advocate"
      difference: "Shares 'how it works' on technical channels"

  startup_cto:
    - stage: "Aware"
      insight: "Bottom-up (dev recommends) or peer mention"
    - stage: "Consider"
      insight: "Adoption proven → ROI → Risk → Integration"
    - stage: "Decide"
      insight: "Multiple devs using → consolidate to Team tier"
    - stage: "Use"
      insight: "Aggregate dashboard, trusts it's working"
    - stage: "Advocate"
      insight: "Private CTO communities, peer referrals"

  trial_model:
    type: "7-day free trial with credit card upfront, auto-converts to paid"
    rationale:
      - "Opt-out trials convert at 48.8% vs 18.2% for opt-in (3x better)"
      - "No free riders clogging resources"
      - "Signals confidence in product value"
      - "Zero risk to user — frictionless cancellation"
      - "Philosophy: Lead with value, find people who truly benefit"

